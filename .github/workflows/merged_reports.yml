name: Merge Reports

on:
  workflow_dispatch:
    inputs:
      android_run_id:
        required: true
        type: string
      ios_run_id:
        required: true
        type: string
      manual_run_id:
        required: true
        type: string

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Create folders
        run: |
          mkdir -p android ios manual merged-report

      # ================= ANDROID =================
      - name: Download Android artifact
        run: |
          echo "Download your android zip here"
          # unzip android.zip -d android

      # ================= iOS =================
      - name: Download iOS artifact
        run: |
          echo "Download your ios zip here"
          # unzip ios.zip -d ios

      # ================= MANUAL =================
      - name: Download Manual artifact
        run: |
          echo "Download your manual zip here"
          # unzip manual.zip -d manual

      # ================= MERGE =================
      - name: Merge reports properly
        run: |
          cp -r android/* merged-report/ || true
          cp -r ios/* merged-report/ || true
          cp -r manual/* merged-report/ || true

          echo "Merged content:"
          ls -R merged-report

      # ================= CHECK =================
      - name: Validate merged folder
        run: |
          if [ -z "$(ls -A merged-report)" ]; then
            echo "❌ merged-report is empty"
            exit 1
          fi

      # ================= UPLOAD =================
      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: merged-report
          path: merged-report