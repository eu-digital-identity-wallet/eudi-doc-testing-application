name: Merge All Serenity Reports

on:
  workflow_dispatch:
    inputs:
      ios_run_id:
        description: "iOS workflow run ID"
        required: true
        type: string

      android_run_id:
        description: "Android workflow run ID"
        required: true
        type: string

      manual_run_id:
        description: "Manual workflow run ID"
        required: true
        type: string

jobs:
  merge-reports:
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # =====================================================
      # PRINT PROVIDED IDS
      # =====================================================
      - name: Print workflow run IDs
        run: |
          echo "======================================="
          echo "iOS Run ID: ${{ inputs.ios_run_id }}"
          echo "Android Run ID: ${{ inputs.android_run_id }}"
          echo "Manual Run ID: ${{ inputs.manual_run_id }}"
          echo "======================================="

      # =====================================================
      # DOWNLOAD IOS ARTIFACT
      # =====================================================
      - name: Download iOS report
        run: |
          mkdir -p merged/ios

          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ inputs.ios_run_id }}/artifacts \
            > ios.json

          echo "===== IOS API RESPONSE ====="
          cat ios.json

          IOS_ARTIFACT_ID=$(jq -r '
            .artifacts[]?
            | select(.name=="ios-serenity-json")
            | .id
          ' ios.json)

          echo "iOS Artifact ID: $IOS_ARTIFACT_ID"

          if [ -z "$IOS_ARTIFACT_ID" ] || [ "$IOS_ARTIFACT_ID" = "null" ]; then
            echo "❌ ios-serenity-json artifact not found"
            exit 1
          fi

          curl -L -H "Authorization: Bearer $GITHUB_TOKEN" \
            -o ios.zip \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${IOS_ARTIFACT_ID}/zip

          unzip -o ios.zip -d merged/ios

      # =====================================================
      # DOWNLOAD ANDROID ARTIFACT
      # =====================================================
      - name: Download Android report
        run: |
          mkdir -p merged/android

          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ inputs.android_run_id }}/artifacts \
            > android.json

          echo "===== ANDROID API RESPONSE ====="
          cat android.json

          ANDROID_ARTIFACT_ID=$(jq -r '
            .artifacts[]?
            | select(.name=="android-serenity-json")
            | .id
          ' android.json)

          echo "Android Artifact ID: $ANDROID_ARTIFACT_ID"

          if [ -z "$ANDROID_ARTIFACT_ID" ] || [ "$ANDROID_ARTIFACT_ID" = "null" ]; then
            echo "❌ android-serenity-json artifact not found"
            exit 1
          fi

          curl -L -H "Authorization: Bearer $GITHUB_TOKEN" \
            -o android.zip \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${ANDROID_ARTIFACT_ID}/zip

          unzip -o android.zip -d merged/android

      # =====================================================
      # DOWNLOAD MANUAL ARTIFACT
      # =====================================================
      - name: Download Manual report
        run: |
          mkdir -p merged/manual

          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ inputs.manual_run_id }}/artifacts \
            > manual.json

          echo "===== MANUAL API RESPONSE ====="
          cat manual.json

          MANUAL_ARTIFACT_ID=$(jq -r '
            .artifacts[]?
            | select(.name=="manual-serenity-json")
            | .id
          ' manual.json)

          echo "Manual Artifact ID: $MANUAL_ARTIFACT_ID"

          if [ -z "$MANUAL_ARTIFACT_ID" ] || [ "$MANUAL_ARTIFACT_ID" = "null" ]; then
            echo "❌ manual-serenity-json artifact not found"
            exit 1
          fi

          curl -L -H "Authorization: Bearer $GITHUB_TOKEN" \
            -o manual.zip \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${MANUAL_ARTIFACT_ID}/zip

          unzip -o manual.zip -d merged/manual

      # =====================================================
      # MERGE JSON RESULTS
      # =====================================================
      - name: Merge all JSON results
        run: |
          mkdir -p merged/all

          find merged/ios -name "*.json" -exec cp {} merged/all/ \;
          find merged/android -name "*.json" -exec cp {} merged/all/ \;
          find merged/manual -name "*.json" -exec cp {} merged/all/ \;

          echo "Merged JSON files:"
          find merged/all -name "*.json"

      # =====================================================
      # OPTIONAL MERGE SCRIPT
      # =====================================================
      - name: Run merge script
        run: |
          python3 merge_serenity_results.py merged/all

      # =====================================================
      # GENERATE FINAL REPORT
      # =====================================================
      - name: Generate final Serenity report
        run: |
          mvn serenity:aggregate \
            -Dserenity.outputDirectory=target/final-report

      # =====================================================
      # VALIDATE REPORT
      # =====================================================
      - name: Validate report
        run: |
          if [ ! -f target/final-report/index.html ]; then
            echo "❌ Serenity report generation failed"
            exit 1
          fi

          echo "✅ Serenity report generated successfully"

      # =====================================================
      # UPLOAD FINAL REPORT
      # =====================================================
      - name: Upload final unified report
        uses: actions/upload-artifact@v4
        with:
          name: FINAL-SERENITY-REPORT
          path: target/final-report