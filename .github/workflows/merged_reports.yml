name: Final Summary Report

on:
  workflow_run:
    workflows:
      - Android Automation Tests Execution
      - iOS Automation Tests Execution
      - Manual Tests Execution
    types:
      - completed

jobs:
  final-report:
    if: |
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: oracle

      # DOWNLOAD ARTIFACTS

      - name: Download Android JSON
        uses: actions/download-artifact@v5
        with:
          name: android-serenity-json
          path: reports/android

      - name: Download iOS JSON
        uses: actions/download-artifact@v5
        with:
          name: ios-serenity-json
          path: reports/ios

      - name: Download Manual JSON
        uses: actions/download-artifact@v5
        with:
          name: manual-serenity-json
          path: reports/manual

      # MERGE

      - name: Create Serenity Directory
        run: |
          mkdir -p target/site/reports/EUDI_Wallet_Version_2025.12.34-Demo

      - name: Merge JSON Results
        run: |
          find reports/android -name "*.json" -exec cp {} target/site/reports/EUDI_Wallet_Version_2025.12.34-Demo/ \;
          find reports/ios -name "*.json" -exec cp {} target/site/reports/EUDI_Wallet_Version_2025.12.34-Demo/ \;
          find reports/manual -name "*.json" -exec cp {} target/site/reports/EUDI_Wallet_Version_2025.12.34-Demo/ \;

      # GENERATE REPORT

      - name: Generate Final Serenity Report
        run: |
          mvn serenity:aggregate

      - name: Upload Final Serenity Report
        uses: actions/upload-artifact@v5
        with:
          name: final-combined-serenity-report
          path: target/site/