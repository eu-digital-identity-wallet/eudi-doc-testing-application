name: Merge All Reports

on:
  workflow_dispatch:
    inputs:
      android_run_id:
        required: true
        type: string
      ios_run_id:
        required: true
        type: string
      manual_run_id:
        required: true
        type: string

jobs:
  merge:
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # DOWNLOAD ARTIFACT (ANDROID)
      # =========================
      - name: Download Android Artifact
        run: |
          mkdir -p android-json

          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
          https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ inputs.android_run_id }}/artifacts > android.json

          ANDROID_ID=$(jq -r '.artifacts[] | select(.name=="android-serenity-json") | .id' android.json)

          curl -L -H "Authorization: Bearer $GITHUB_TOKEN" \
            -o android.zip \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ANDROID_ID/zip

          unzip -o android.zip -d android-json

      # =========================
      # DOWNLOAD ARTIFACT (iOS)
      # =========================
      - name: Download iOS Artifact
        run: |
          mkdir -p ios-json

          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
          https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ inputs.ios_run_id }}/artifacts > ios.json

          IOS_ID=$(jq -r '.artifacts[] | select(.name=="ios-serenity-json") | .id' ios.json)

          curl -L -H "Authorization: Bearer $GITHUB_TOKEN" \
            -o ios.zip \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$IOS_ID/zip

          unzip -o ios.zip -d ios-json

      # =========================
      # DOWNLOAD ARTIFACT (MANUAL)
      # =========================
      - name: Download Manual Artifact
        run: |
          mkdir -p manual-json

          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
          https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ inputs.manual_run_id }}/artifacts > manual.json

          MANUAL_ID=$(jq -r '.artifacts[] | select(.name=="manual-serenity-json") | .id' manual.json)

          curl -L -H "Authorization: Bearer $GITHUB_TOKEN" \
            -o manual.zip \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$MANUAL_ID/zip

          unzip -o manual.zip -d manual-json

      # =========================
      # DEBUG (IMPORTANT)
      # =========================
      - name: Debug extracted files
        run: |
          echo "ANDROID:"
          find android-json -type f | head -50

          echo "IOS:"
          find ios-json -type f | head -50

          echo "MANUAL:"
          find manual-json -type f | head -50

      # =========================
      # MERGE ALL JSON SAFELY
      # =========================
      - name: Merge JSON (robust)
        run: |
          mkdir -p merged-json

          find android-json -type f -name "*.json" -exec cp {} merged-json/ \;
          find ios-json -type f -name "*.json" -exec cp {} merged-json/ \;
          find manual-json -type f -name "*.json" -exec cp {} merged-json/ \;

          echo "Merged JSON files:"
          ls -lh merged-json

      # =========================
      # SAFETY CHECK (VERY IMPORTANT)
      # =========================
      - name: Validate JSON exists
        run: |
          COUNT=$(find merged-json -name "*.json" | wc -l)
          echo "Total JSON files: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "❌ No JSON files found. Merge failed."
            exit 1
          fi

      # =========================
      # RUN SERENITY AGGREGATION
      # =========================
      - name: Generate Serenity Report
        run: |
          mvn serenity:aggregate \
            -Dserenity.sourceDirectory=merged-json \
            -Dserenity.outputDirectory=final-report

      # =========================
      # UPLOAD FINAL REPORT
      # =========================
      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: merged-serenity-report
          path: final-report