name: Merge All Serenity Reports

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - iOS Automation Tests Execution
      - Android Automation Tests Execution
      - Manual Tests Execution
    types:
      - completed

jobs:
  merge-reports:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download iOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-serenity-json
          path: merged/ios

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-serenity-json
          path: merged/android

      - name: Download Manual artifacts
        uses: actions/download-artifact@v4
        with:
          name: manual-serenity-json
          path: merged/manual

      - name: Merge all JSON results
        run: |
          mkdir -p merged/all
          cp merged/ios/**/*.json merged/all/ 2>/dev/null || true
          cp merged/android/**/*.json merged/all/ 2>/dev/null || true
          cp merged/manual/**/*.json merged/all/ 2>/dev/null || true

          echo "Merged JSON files:"
          find merged/all -name "*.json"

      - name: Run merge script
        run: |
          python3 merge_serenity_results.py merged/all

      - name: Generate final Serenity report
        run: |
          mvn serenity:aggregate \
            -Dserenity.outputDirectory=target/final-report

      - name: Upload final unified report
        uses: actions/upload-artifact@v5
        with:
          name: FINAL-SERENITY-REPORT
          path: target/final-report