name: Merge Serenity Reports

on:
  workflow_dispatch:
    inputs:
      android_run_id:
        required: true
        type: string
      ios_run_id:
        required: true
        type: string
      manual_run_id:
        required: true
        type: string

jobs:
  merge:
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ===================== DOWNLOAD ARTIFACTS =====================
      - name: Setup folders
        run: |
          mkdir -p android ios manual merged-results merged-report

      - name: Download Android artifact
        run: |
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
          https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ inputs.android_run_id }}/artifacts > android.json

          ANDROID_ID=$(jq -r '.artifacts[] | select(.name=="android-serenity-json") | .id' android.json)

          curl -L -H "Authorization: Bearer $GITHUB_TOKEN" \
            -o android.zip \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ANDROID_ID/zip

          unzip -o android.zip -d android

      - name: Download iOS artifact
        run: |
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
          https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ inputs.ios_run_id }}/artifacts > ios.json

          IOS_ID=$(jq -r '.artifacts[] | select(.name=="ios-serenity-json") | .id' ios.json)

          curl -L -H "Authorization: Bearer $GITHUB_TOKEN" \
            -o ios.zip \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$IOS_ID/zip

          unzip -o ios.zip -d ios

      - name: Download Manual artifact
        run: |
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
          https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ inputs.manual_run_id }}/artifacts > manual.json

          MANUAL_ID=$(jq -r '.artifacts[] | select(.name=="manual-serenity-json") | .id' manual.json)

          curl -L -H "Authorization: Bearer $GITHUB_TOKEN" \
            -o manual.zip \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$MANUAL_ID/zip

          unzip -o manual.zip -d manual

      # ===================== MERGE SERENITY RAW RESULTS =====================
      - name: Merge Serenity JSON results (IMPORTANT FIX)
        run: |
          echo "Merging Serenity raw results..."

          # THIS is the ONLY correct input for Serenity aggregate
          find android -name "*.json" -exec cp {} merged-results/ \; 2>/dev/null || true
          find ios -name "*.json" -exec cp {} merged-results/ \; 2>/dev/null || true
          find manual -name "*.json" -exec cp {} merged-results/ \; 2>/dev/null || true

          echo "Merged JSON files:"
          ls -lh merged-results

      # ===================== GENERATE FINAL REPORT =====================
      - name: Generate Serenity Report
        run: |
          mvn serenity:aggregate \
            -Dserenity.outputDirectory=merged-report

      # ===================== VALIDATION =====================
      - name: Validate report
        run: |
          if [ ! -f merged-report/index.html ]; then
            echo "❌ Serenity report not generated"
            exit 1
          fi

      # ===================== UPLOAD =====================
      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: merged-serenity-report
          path: merged-report