name: Merge All Reports

on:
  workflow_dispatch:
    inputs:
      android_run_id:
        required: true
        type: string
      ios_run_id:
        required: true
        type: string
      manual_run_id:
        required: true
        type: string

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Create folders
        run: |
          mkdir android ios manual merged-report

      # ===================== ANDROID =====================
      - name: Download Android report
        run: |
          curl -L -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          https://api.github.com/repos/${{ github.repository }}/actions/artifacts \
          -o android.json

      # (replace with your real download method)
      # unzip android report into folder
      - run: echo "Unzip android report here"

      # ===================== IOS =====================
      - name: Download iOS report
        run: echo "Download + unzip iOS report"

      # ===================== MANUAL =====================
      - name: Download Manual report
        run: echo "Download + unzip manual report"

      # ===================== MERGE =====================
      - name: Combine reports
        run: |
          cp -r android/* merged-report/ || true
          cp -r ios/* merged-report/ || true
          cp -r manual/* merged-report/ || true

      # ===================== RESULT =====================
      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: combined-report
          path: merged-report