name: Merge Serenity Reports

on:
  workflow_run:
    workflows:
      - Android Automation Tests Execution
      - iOS Automation Tests Execution
      - Manual Tests Execution
    types:
      - completed

jobs:
  merge:
    runs-on: macos-latest

    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-serenity-json
          path: artifacts/android
        continue-on-error: true

      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-serenity-json
          path: artifacts/ios
        continue-on-error: true

      - name: Download Manual artifact
        uses: actions/download-artifact@v4
        with:
          name: manual-serenity-json
          path: artifacts/manual
        continue-on-error: true

      - name: Merge Serenity JSON results
        run: |
          mkdir -p merged

          cp -r artifacts/android/* merged/ 2>/dev/null || true
          cp -r artifacts/ios/* merged/ 2>/dev/null || true
          cp -r artifacts/manual/* merged/ 2>/dev/null || true

          echo "Merged files:"
          ls -R merged

      - name: Run merge script
        run: |
          python3 merge_serenity_results.py merged || true

      - name: Generate combined report
        run: |
          mvn serenity:aggregate

      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: combined-serenity-report
          path: target/site