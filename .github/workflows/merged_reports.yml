name: Merge All Reports

on:
  workflow_dispatch:
    inputs:
      android_run_id:
        description: 'Android Run ID'
        required: true
        type: string
      ios_run_id:
        description: 'iOS Run ID'
        required: true
        type: string
      manual_run_id:
        description: 'manual Run ID'
        required: true
        type: string

jobs:
  merge-reports:
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # DOWNLOAD ANDROID REPORT
      # =========================
      - name: Download Android Report Artifact
        run: |
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ inputs.android_run_id }}/artifacts > android.json

          ANDROID_ID=$(jq -r '.artifacts[] | select(.name=="android-serenity-report") | .id' android.json)

          curl -L -H "Authorization: Bearer $GITHUB_TOKEN" \
            -o android.zip \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ANDROID_ID/zip

          unzip android.zip -d android-report

      # =========================
      # DOWNLOAD iOS REPORT
      # =========================
      - name: Download iOS Report Artifact
        run: |
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ inputs.ios_run_id }}/artifacts > ios.json

          IOS_ID=$(jq -r '.artifacts[] | select(.name=="ios-serenity-report") | .id' ios.json)

          curl -L -H "Authorization: Bearer $GITHUB_TOKEN" \
            -o ios.zip \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$IOS_ID/zip

          unzip ios.zip -d ios-report

      # =========================
      # DOWNLOAD MANUAL REPORT
      # =========================
      - name: Download Manual Report Artifact
        run: |
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ inputs.manual_run_id }}/artifacts > manual.json

          MANUAL_ID=$(jq -r '.artifacts[] | select(.name=="manual-serenity-report") | .id' manual.json)

          curl -L -H "Authorization: Bearer $GITHUB_TOKEN" \
            -o manual.zip \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$MANUAL_ID/zip

          unzip manual.zip -d manual-report

      # =========================
      # MERGE REPORTS (FILE LEVEL)
      # =========================
      - name: Merge All Serenity Reports
        run: |
          mkdir merged-report

          cp -r android-report/* merged-report/ || true
          cp -r ios-report/* merged-report/ || true
          cp -r manual-report/* merged-report/ || true

      # =========================
      # LIST MERGED OUTPUT
      # =========================
      - name: Verify merged report
        run: |
          find merged-report | head -100

      # =========================
      # OPTIONAL: RE-GENERATE AGGREGATED REPORT
      # =========================
      - name: Generate Final Serenity Report
        run: |
          mvn serenity:aggregate \
            -Dserenity.outputDirectory=final-report \
            -Dserenity.sourceDirectory=merged-report

      # =========================
      # UPLOAD FINAL REPORT
      # =========================
      - name: Upload Final Report
        uses: actions/upload-artifact@v4
        with:
          name: merged-serenity-report
          path: final-report