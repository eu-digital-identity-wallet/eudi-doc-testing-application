name: Merge Serenity Reports

on:
  workflow_dispatch:
    inputs:
      android_run_id:
        required: true
        type: string
      ios_run_id:
        required: true
        type: string
      manual_run_id:
        required: true
        type: string

jobs:
  merge:
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ===================== DOWNLOAD ARTIFACTS =====================
      - name: Download Android report
        run: |
          mkdir -p android ios manual merged-results

          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ inputs.android_run_id }}/artifacts > android.json

          ANDROID_ID=$(jq -r '.artifacts[] | select(.name=="android-serenity-report") | .id' android.json)

          curl -L -H "Authorization: Bearer $GITHUB_TOKEN" \
            -o android.zip \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ANDROID_ID/zip

          unzip -o android.zip -d android

      - name: Download iOS report
        run: |
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ inputs.ios_run_id }}/artifacts > ios.json

          IOS_ID=$(jq -r '.artifacts[] | select(.name=="ios-serenity-report") | .id' ios.json)

          curl -L -H "Authorization: Bearer $GITHUB_TOKEN" \
            -o ios.zip \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$IOS_ID/zip

          unzip -o ios.zip -d ios

      - name: Download Manual report
        run: |
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ inputs.manual_run_id }}/artifacts > manual.json

          MANUAL_ID=$(jq -r '.artifacts[] | select(.name=="manual-serenity-report") | .id' manual.json)

          curl -L -H "Authorization: Bearer $GITHUB_TOKEN" \
            -o manual.zip \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$MANUAL_ID/zip

          unzip -o manual.zip -d manual

      # ===================== MERGE SERENITY RAW RESULTS =====================
      - name: Merge Serenity results
        run: |
          mkdir -p merged-results

          echo "Copying Serenity result files..."

          # IMPORTANT: merge raw serenity output, NOT HTML
          cp -r android/**/target/site/serenity/* merged-results/ 2>/dev/null || true
          cp -r ios/**/target/site/serenity/* merged-results/ 2>/dev/null || true
          cp -r manual/**/target/site/serenity/* merged-results/ 2>/dev/null || true

          echo "Merged raw Serenity results:"
          ls -R merged-results

      # ===================== GENERATE FINAL REPORT =====================
      - name: Generate Serenity report
        run: |
          mvn serenity:aggregate \
            -Dserenity.outputDirectory=merged-report \
            -Dserenity.test.root=merged-results

      # ===================== VALIDATION =====================
      - name: Validate report
        run: |
          if [ ! -f merged-report/index.html ]; then
            echo "❌ Serenity report generation failed"
            exit 1
          fi

      # ===================== UPLOAD FINAL REPORT =====================
      - name: Upload merged Serenity report
        uses: actions/upload-artifact@v4
        with:
          name: merged-serenity-report
          path: merged-report