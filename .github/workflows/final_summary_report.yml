name: Merge Serenity Reports

on:
  workflow_dispatch:
    inputs:
      run-ids:
        description: 'Run IDs separated by commas'
        required: true
        type: string
        default: '35104244652,35104244680'

jobs:
  merge-reports:
    runs-on: macos-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v5


      # ============================================================
      # 2. JAVA
      # ============================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: oracle
          cache: maven


      # ============================================================
      # 3. CLEAN DIRECTORIES
      # ============================================================
      - name: Create report directories
        run: |
          rm -rf reports
          rm -rf target/serenity-input
          rm -rf target/site/reports

          mkdir -p reports
          mkdir -p target/serenity-input


      # ============================================================
      # 4. DOWNLOAD REPORTS FROM ALL RUNS
      # ============================================================
      - name: Download Serenity reports
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          RUN_IDS: ${{ inputs.run-ids }}

        run: |

          echo "========================================="
          echo "RUN IDS"
          echo "========================================="
          echo "$RUN_IDS"

          IFS=',' read -ra IDS <<< "$RUN_IDS"

          for RUN_ID in "${IDS[@]}"
          do

            RUN_ID=$(echo "$RUN_ID" | xargs)

            echo ""
            echo "========================================="
            echo "PROCESSING RUN: $RUN_ID"
            echo "========================================="

            mkdir -p "reports/$RUN_ID/android"
            mkdir -p "reports/$RUN_ID/ios"
            mkdir -p "reports/$RUN_ID/manual"


            echo "Downloading Android Serenity report..."

            gh run download "$RUN_ID" \
              --repo "${{ github.repository }}" \
              --name android-serenity-json \
              --dir "reports/$RUN_ID/android" \
              || echo "No Android report found for $RUN_ID"


            echo "Downloading iOS Serenity report..."

            gh run download "$RUN_ID" \
              --repo "${{ github.repository }}" \
              --name ios-serenity-json \
              --dir "reports/$RUN_ID/ios" \
              || echo "No iOS report found for $RUN_ID"


            echo "Downloading Manual Serenity report..."

            gh run download "$RUN_ID" \
              --repo "${{ github.repository }}" \
              --name manual-serenity-json \
              --dir "reports/$RUN_ID/manual" \
              || echo "No Manual report found for $RUN_ID"

          done


      # ============================================================
      # 5. SHOW DOWNLOADED FILES
      # ============================================================
      - name: Show downloaded files
        run: |

          echo "========================================="
          echo "DOWNLOADED FILES"
          echo "========================================="

          find reports -type f -print


      # ============================================================
      # 6. COLLECT JSON FILES
      #
      # IMPORTANT:
      # Prefix every JSON with RUN_ID.
      # This prevents files from different runs overwriting each other.
      # ============================================================
      - name: Collect Serenity JSON files
        run: |

          INPUT_DIR="target/serenity-input"

          echo "========================================="
          echo "COLLECTING SERENITY JSON FILES"
          echo "========================================="

          find reports -type f -name "*.json" -print


          find reports -type f -name "*.json" | while read FILE
          do

            RUN_ID=$(echo "$FILE" | cut -d'/' -f2)
            FILE_NAME=$(basename "$FILE")

            cp "$FILE" "$INPUT_DIR/${RUN_ID}_${FILE_NAME}"

          done


          echo ""
          echo "========================================="
          echo "FINAL SERENITY INPUT FILES"
          echo "========================================="

          find "$INPUT_DIR" -type f -name "*.json" -print


      # ============================================================
      # 7. GENERATE ONE COMBINED SERENITY REPORT
      # ============================================================
      - name: Generate Final Serenity Report
        run: |

          echo "========================================="
          echo "GENERATING COMBINED SERENITY REPORT"
          echo "========================================="

          rm -rf target/site/reports/EUDI_Wallet_Version_2026.08.41-Demo

          mvn serenity:aggregate \
            -Dserenity.sourceDirectory=target/serenity-input \
            -Dserenity.outputDirectory=target/site/reports/EUDI_Wallet_Version_2026.08.41-Demo


      # ============================================================
      # 8. VERIFY REPORT
      # ============================================================
      - name: Verify generated Serenity report
        if: always()
        run: |

          REPORT_DIR="target/site/reports/EUDI_Wallet_Version_2026.08.41-Demo"

          echo "========================================="
          echo "REPORT DIRECTORY"
          echo "========================================="

          if [ ! -d "$REPORT_DIR" ]; then
            echo "ERROR: Serenity report directory does not exist."
            exit 1
          fi

          ls -lah "$REPORT_DIR"


          echo ""
          echo "========================================="
          echo "INDEX.HTML"
          echo "========================================="

          if [ -f "$REPORT_DIR/index.html" ]; then
            echo "index.html FOUND"
          else
            echo "ERROR: index.html NOT FOUND"
            exit 1
          fi


          echo ""
          echo "========================================="
          echo "HTML FILE COUNT"
          echo "========================================="

          HTML_COUNT=$(find "$REPORT_DIR" -type f -name "*.html" | wc -l)

          echo "HTML files: $HTML_COUNT"


          echo ""
          echo "========================================="
          echo "SAMPLE HTML FILES"
          echo "========================================="

          find "$REPORT_DIR" -type f -name "*.html" | head -30


      # ============================================================
      # 9. CHECK THE SPECIFIC FILE FROM YOUR ERROR
      # ============================================================
      - name: Verify Serenity detail pages
        if: always()
        run: |

          REPORT_DIR="target/site/reports/EUDI_Wallet_Version_2026.08.41-Demo"

          FILE="0272dadd83d6e6ac748d9a947522ca78b8873f5156f9bd38d6a0eb735ee5993b.html"

          echo "========================================="
          echo "CHECKING DETAIL PAGE"
          echo "========================================="

          if find "$REPORT_DIR" -type f -name "$FILE" | grep -q "$FILE"; then
            echo "FOUND: $FILE"
          else
            echo "NOT FOUND: $FILE"
          fi


      # ============================================================
      # 10. CHECK BROKEN HTML REFERENCES
      # ============================================================
      - name: Check broken HTML references
        if: always()
        run: |

          REPORT_DIR="target/site/reports/EUDI_Wallet_Version_2026.08.41-Demo"

          python3 <<'PY'

          import os
          import re

          report_dir = "target/site/reports/EUDI_Wallet_Version_2026.08.41-Demo"

          html_files = []

          for root, dirs, files in os.walk(report_dir):

              for file in files:

                  if file.endswith(".html"):
                      html_files.append(
                          os.path.join(root, file)
                      )


          print(f"HTML files found: {len(html_files)}")


          existing_files = set()

          for path in html_files:
              existing_files.add(os.path.basename(path))


          broken = set()


          for path in html_files:

              with open(
                  path,
                  "r",
                  encoding="utf-8",
                  errors="ignore"
              ) as f:

                  content = f.read()


              references = re.findall(
                  r'(?:href|src)=["\']([^"\']+\.html)["\']',
                  content
              )


              for reference in references:

                  filename = os.path.basename(reference)

                  if filename not in existing_files:

                      broken.add(filename)


          print("")
          print("=========================================")
          print("BROKEN HTML REFERENCES")
          print("=========================================")


          if broken:

              for item in sorted(broken):
                  print(item)

              print("")
              print(
                  f"Total broken references: {len(broken)}"
              )

          else:

              print("No broken HTML references found.")

          PY


#      # ============================================================
#      # 11. CUSTOM CSS
#      # ============================================================
#      - name: Replace Serenity Core CSS
#        if: always()
#        run: |
#
#          REPORT_DIR="target/site/reports/EUDI_Wallet_Version_2026.08.41-Demo"
#
#          if [ -f "$REPORT_DIR/css/core.css" ]; then
#
#            cp src/test/resources/custom-style.css \
#              "$REPORT_DIR/css/core.css"
#
#            echo "Custom CSS applied."
#
#          else
#
#            echo "Serenity core.css not found."
#
#          fi


      # ============================================================
      # 12. UPLOAD ONLY THE FINAL REPORT
      #
      # IMPORTANT:
      # Upload the report directory itself.
      # ============================================================
      - name: Upload Final Serenity Report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: final-combined-serenity-report
          path: target/site/reports/EUDI_Wallet_Version_2026.08.41-Demo/
          if-no-files-found: error