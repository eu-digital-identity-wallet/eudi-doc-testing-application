name: Merge Serenity Reports

on:
  workflow_dispatch:
    inputs:
      run-ids:
        description: 'Run IDs separated by commas'
        required: true
        type: string
        default: '35104244652,35104244680'

jobs:
  merge-reports:
    runs-on: macos-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout
        uses: actions/checkout@v5


      # =========================================================
      # 2. SET UP JAVA
      # =========================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: oracle
          cache: maven


      # =========================================================
      # 3. CREATE DIRECTORIES
      # =========================================================

      - name: Create report directories
        run: |
          rm -rf reports
          rm -rf target/site/reports

          mkdir -p reports
          mkdir -p target/serenity-input
          mkdir -p target/site/reports/EUDI_Wallet_Version_2026.08.41-Demo


      # =========================================================
      # 4. DOWNLOAD ALL SERENITY JSON REPORTS
      # =========================================================

      - name: Download Serenity reports
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          RUN_IDS: ${{ inputs.run-ids }}

        run: |

          echo "========================================="
          echo "RUN IDS"
          echo "========================================="

          echo "$RUN_IDS"

          IFS=',' read -ra IDS <<< "$RUN_IDS"

          for RUN_ID in "${IDS[@]}"; do

            RUN_ID=$(echo "$RUN_ID" | xargs)

            echo ""
            echo "========================================="
            echo "Processing Run ID: $RUN_ID"
            echo "========================================="

            mkdir -p "reports/$RUN_ID/android"
            mkdir -p "reports/$RUN_ID/ios"
            mkdir -p "reports/$RUN_ID/manual"

            echo "Downloading Android report..."

            gh run download "$RUN_ID" \
              --repo "${{ github.repository }}" \
              --name android-serenity-json \
              --dir "reports/$RUN_ID/android" \
              || echo "No Android report."


            echo "Downloading iOS report..."

            gh run download "$RUN_ID" \
              --repo "${{ github.repository }}" \
              --name ios-serenity-json \
              --dir "reports/$RUN_ID/ios" \
              || echo "No iOS report."


            echo "Downloading Manual report..."

            gh run download "$RUN_ID" \
              --repo "${{ github.repository }}" \
              --name manual-serenity-json \
              --dir "reports/$RUN_ID/manual" \
              || echo "No Manual report."

          done


      # =========================================================
      # 5. SHOW DOWNLOADED FILES
      # =========================================================

      - name: Show downloaded files
        run: |

          echo "========================================="
          echo "DOWNLOADED FILES"
          echo "========================================="

          find reports -type f -print


      # =========================================================
      # 6. COPY JSON FILES TO SERENITY INPUT
      # =========================================================

      - name: Collect Serenity JSON files
        run: |

          INPUT_DIR="target/serenity-input"

          echo "========================================="
          echo "COLLECTING JSON FILES"
          echo "========================================="

          find reports -type f -name "*.json" -print


          find reports -type f -name "*.json" | while read FILE
          do

            RUN_ID=$(echo "$FILE" | cut -d'/' -f2)
            FILE_NAME=$(basename "$FILE")

            cp "$FILE" "$INPUT_DIR/${RUN_ID}_${FILE_NAME}"

          done


          echo ""
          echo "========================================="
          echo "FINAL INPUT FILES"
          echo "========================================="

          find "$INPUT_DIR" -type f -name "*.json" -print


      # =========================================================
      # 7. GENERATE COMBINED SERENITY REPORT
      # =========================================================

      - name: Generate Final Serenity Report
        run: |

          echo "========================================="
          echo "GENERATING COMBINED SERENITY REPORT"
          echo "========================================="

          mvn serenity:aggregate \
            -Dserenity.sourceDirectory=target/serenity-input \
            -Dserenity.outputDirectory=target/site/reports/EUDI_Wallet_Version_2026.08.41-Demo


      # =========================================================
      # 8. SHOW GENERATED REPORT
      # =========================================================

      - name: Verify generated report
        if: always()
        run: |

          echo "========================================="
          echo "GENERATED REPORT FILES"
          echo "========================================="

          find target/site/reports/EUDI_Wallet_Version_2026.08.41-Demo \
            -maxdepth 2 \
            -type f \
            | sort


      # =========================================================
      # 9. REPLACE CSS
      # =========================================================

      - name: Replace Serenity Core CSS
        if: always()
        run: |

          REPORT_DIR="target/site/reports/EUDI_Wallet_Version_2026.08.41-Demo"

          cp src/test/resources/custom-style.css \
             "$REPORT_DIR/css/core.css" \
             || true


      # =========================================================
      # 10. UPLOAD FINAL REPORT
      # =========================================================

      - name: Upload Final Serenity Report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: final-combined-serenity-report
          path: target/site/reports/EUDI_Wallet_Version_2026.08.41-Demo/