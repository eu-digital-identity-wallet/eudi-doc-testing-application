name: Merge Serenity Reports

on:
  workflow_dispatch:
    inputs:
      run-ids:
        description: 'Run IDs separated by commas'
        required: true
        type: string
        default: '35104244652,35104244680'

jobs:
  merge-reports:
    runs-on: macos-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v5


      # ============================================================
      # JAVA
      # ============================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: oracle
          cache: maven


      # ============================================================
      # CLEAN
      # ============================================================
      - name: Clean previous reports
        run: |
          rm -rf reports
          rm -rf target/serenity-input
          rm -rf target/site/reports

          mkdir -p reports
          mkdir -p target/serenity-input


      # ============================================================
      # DOWNLOAD ALL SERENITY ARTIFACTS
      # ============================================================
      - name: Download Serenity reports
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          RUN_IDS: ${{ inputs.run-ids }}

        run: |

          IFS=',' read -ra IDS <<< "$RUN_IDS"

          for RUN_ID in "${IDS[@]}"
          do

            RUN_ID=$(echo "$RUN_ID" | xargs)

            echo ""
            echo "========================================="
            echo "PROCESSING RUN $RUN_ID"
            echo "========================================="

            mkdir -p "reports/$RUN_ID/android"
            mkdir -p "reports/$RUN_ID/ios"
            mkdir -p "reports/$RUN_ID/manual"


            gh run download "$RUN_ID" \
              --repo "${{ github.repository }}" \
              --name android-serenity-json \
              --dir "reports/$RUN_ID/android" \
              || echo "No Android Serenity artifact"


            gh run download "$RUN_ID" \
              --repo "${{ github.repository }}" \
              --name ios-serenity-json \
              --dir "reports/$RUN_ID/ios" \
              || echo "No iOS Serenity artifact"


            gh run download "$RUN_ID" \
              --repo "${{ github.repository }}" \
              --name manual-serenity-json \
              --dir "reports/$RUN_ID/manual" \
              || echo "No Manual Serenity artifact"

          done


      # ============================================================
      # SHOW DOWNLOADED FILES
      # ============================================================
      - name: Show downloaded Serenity JSON
        run: |

          echo "========================================="
          echo "DOWNLOADED JSON FILES"
          echo "========================================="

          find reports \
            -type f \
            -name "*.json" \
            -print


      # ============================================================
      # PREPARE SERENITY INPUT
      #
      # Every JSON gets a unique filename to prevent overwriting.
      # ============================================================
      - name: Prepare Serenity input
        run: |

          echo "========================================="
          echo "PREPARING SERENITY INPUT"
          echo "========================================="

          find reports \
            -type f \
            -name "*.json" |
          while read FILE
          do

            RUN_ID=$(echo "$FILE" | cut -d'/' -f2)
            FILE_NAME=$(basename "$FILE")

            cp "$FILE" \
              "target/serenity-input/${RUN_ID}_${FILE_NAME}"

          done


          echo ""
          echo "========================================="
          echo "SERENITY INPUT"
          echo "========================================="

          find target/serenity-input \
            -type f \
            -name "*.json" \
            -print


      # ============================================================
      # VALIDATE JSON
      # ============================================================
      - name: Validate Serenity input
        run: |

          JSON_COUNT=$(find target/serenity-input \
            -type f \
            -name "*.json" | wc -l)

          echo "Serenity JSON files: $JSON_COUNT"

          if [ "$JSON_COUNT" -eq 0 ]; then
            echo "ERROR: No Serenity JSON files found."
            exit 1
          fi


      # ============================================================
      # GENERATE ONE COMBINED REPORT
      # ============================================================
      - name: Generate combined Serenity report
        run: |

          echo "========================================="
          echo "GENERATING COMBINED SERENITY REPORT"
          echo "========================================="

          mvn serenity:aggregate \
            -Dserenity.sourceDirectory=target/serenity-input \
            -Dserenity.outputDirectory=target/site/reports/EUDI_Wallet_Version_2026.08.41-Demo


      # ============================================================
      # VERIFY REPORT
      # ============================================================
      - name: Verify combined report
        run: |

          REPORT_DIR="target/site/reports/EUDI_Wallet_Version_2026.08.41-Demo"

          echo "========================================="
          echo "REPORT VALIDATION"
          echo "========================================="

          if [ ! -f "$REPORT_DIR/index.html" ]; then
            echo "ERROR: index.html was not generated."
            exit 1
          fi

          echo "index.html: OK"


          HTML_COUNT=$(find "$REPORT_DIR" \
            -type f \
            -name "*.html" | wc -l)

          echo "HTML files: $HTML_COUNT"


          echo ""
          echo "Report files:"
          find "$REPORT_DIR" \
            -maxdepth 2 \
            -type f \
            | sort


      # ============================================================
      # CUSTOM CSS
      # ============================================================
      - name: Replace Serenity Core CSS
        if: always()
        run: |

          REPORT_DIR="target/site/reports/EUDI_Wallet_Version_2026.08.41-Demo"

          if [ -f "$REPORT_DIR/css/core.css" ]; then

            cp src/test/resources/custom-style.css \
              "$REPORT_DIR/css/core.css"

            echo "Custom CSS applied."

          else

            echo "core.css not found."

          fi


      # ============================================================
      # UPLOAD ONLY THE FINAL REPORT
      # ============================================================
      - name: Upload final combined Serenity report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: final-combined-serenity-report
          path: target/site/reports/EUDI_Wallet_Version_2026.08.41-Demo/
          if-no-files-found: error