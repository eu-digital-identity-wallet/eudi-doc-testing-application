name: Merge Serenity Reports

on:
  workflow_dispatch:
    inputs:
      run-ids:
        description: 'Run IDs separated by commas'
        required: true
        type: string
        default: '35104244652,35104244680'

jobs:

  merge-reports:
    runs-on: macos-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout
        uses: actions/checkout@v5


      # =========================================================
      # 2. SET UP JAVA
      # =========================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: oracle
          cache: maven


      # =========================================================
      # 3. CREATE REPORT DIRECTORIES
      # =========================================================

      - name: Create report directories
        run: |
          mkdir -p reports
          mkdir -p target/site/reports/EUDI_Wallet_Version_2026.08.41-Demo
      

      # =========================================================
      # 4. DOWNLOAD REPORTS FROM RUN IDS
      # =========================================================

      - name: Download Serenity reports
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          RUN_IDS: ${{ inputs.run-ids }}
        run: |
          
          echo "Run IDs: $RUN_IDS"
          
          IFS=',' read -ra IDS <<< "$RUN_IDS"
          
          for RUN_ID in "${IDS[@]}"; do
          
            RUN_ID=$(echo "$RUN_ID" | xargs)
          
            echo "========================================="
            echo "Downloading artifact from Run ID: $RUN_ID"
            echo "========================================="
          
            mkdir -p "reports/$RUN_ID"
          
            gh run download "$RUN_ID" \
              --repo "${{ github.repository }}" \
              --name android-serenity-json \
              --dir "reports/$RUN_ID" \
              || \
            gh run download "$RUN_ID" \
              --repo "${{ github.repository }}" \
              --name ios-serenity-json \
              --dir "reports/$RUN_ID" \
              || \
            gh run download "$RUN_ID" \
              --repo "${{ github.repository }}" \
              --name manual-serenity-json \
              --dir "reports/$RUN_ID"
          
          done
      

      # =========================================================
      # 5. SHOW DOWNLOADED FILES
      # =========================================================

      - name: Show downloaded files
        run: |
          echo "========================================="
          echo "DOWNLOADED FILES"
          echo "========================================="
          
          find reports -type f
      

      # =========================================================
      # 6. COPY ALL JSON FILES
      # =========================================================

      - name: Merge JSON files
        run: |
          
          REPORT_DIR="target/site/reports/EUDI_Wallet_Version_2026.08.41-Demo"
          
          echo "Copying Serenity JSON files..."
          
          find reports -name "*.json" -exec cp {} "$REPORT_DIR/" \;
          
          echo "========================================="
          echo "JSON FILES TO AGGREGATE"
          echo "========================================="
          
          find "$REPORT_DIR" -name "*.json"
      

      # =========================================================
      # 7. GENERATE COMBINED SERENITY REPORT
      # =========================================================

      - name: Generate Final Serenity Report
        run: |
          mvn serenity:aggregate
      

      # =========================================================
      # 8. UPLOAD FINAL REPORT
      # =========================================================

      - name: Upload Final Serenity Report
        uses: actions/upload-artifact@v5
        with:
          name: final-combined-serenity-report
          path: target/site/