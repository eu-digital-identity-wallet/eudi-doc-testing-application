name: iOS Automation Tests Execution

run-name: "ios Automation Tests Execution | ${{ inputs.test-cases }}"

on:
  workflow_dispatch:
    inputs:
      branch-to-checkout:
        description: 'Branch to checkout'
        type: choice
        options:
          - main
          - develop
          - milestone/2026.Q1
          - milestone/2026.Q2
          - milestone/2026.Q3
          - milestone/2026.Q3.1
          - milestone/2026.Q4
        default: develop

      test-cases:
        description: 'iOS Tags to execute'
        type: choice
        options:
          - PID_mso_mdoc
          - MDL
          - PID_sdjwt
          - GENERAL_TESTS

      device-logs-enabled:
        description: 'Enable BrowserStack device logs (true/false)'
        type: boolean
        default: true

      environment:
        description: 'Environment to run against'
        type: choice
        options:
          - prod
          - dev
        default: prod

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 240

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          clean: false
          lfs: false
          ref: ${{ inputs.branch-to-checkout }}

      # ---------------- JAVA + NODE ----------------
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'oracle'

      - name: Set up Node JS
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      # ---------------- CHROME + SELENIUM ----------------
      - name: Prepare Chrome and Selenium Manager
        shell: bash
        run: |
          set -e

          CHROME="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"

          echo "========== Chrome =========="
          "$CHROME" --version

          echo "========== Remove Selenium Manager cache =========="
          rm -rf "$HOME/.cache/selenium"

          echo "========== Remove manually installed ChromeDriver =========="

          brew uninstall --ignore-dependencies chromedriver 2>/dev/null || true

          sudo rm -f /usr/local/bin/chromedriver 2>/dev/null || true
          sudo rm -f /opt/homebrew/bin/chromedriver 2>/dev/null || true

          echo "========== ChromeDriver on PATH =========="

          if command -v chromedriver >/dev/null 2>&1; then
            echo "WARNING: ChromeDriver still exists:"
            which chromedriver
            chromedriver --version || true
          else
            echo "No ChromeDriver on PATH"
            echo "Selenium Manager will resolve the compatible driver."
          fi

          echo "========== Selenium cache =========="

          if [ -d "$HOME/.cache/selenium" ]; then
            find "$HOME/.cache/selenium" -maxdepth 3 -type f -print
          else
            echo "Selenium cache is clean."
          fi

      # ---------------- CLEAN ----------------
      - name: Clean Old Results
        run: |
          rm -rf target/serenity
          rm -rf target/site/reports
          rm -rf target/site/serenity
          rm -f target/rerun.txt target/rerun2.txt target/rerun3.txt target/rerun4.txt

      - name: Initialize Session Map
        run: echo "" > session_map.txt

      # ---------------- JQ ----------------
      - name: Check jq Installation
        run: |
          if ! command -v jq &> /dev/null; then
            brew install jq
          else
            jq --version
          fi

      # ---------------- BROWSERSTACK CHECK ----------------
      - name: Check BrowserStack Credentials
        run: |
          curl -u "${BROWSERSTACK_USERNAME}:${BROWSERSTACK_ACCESS_KEY}" \
          https://api.browserstack.com/automate/plan.json

      # ---------------- BUILD ID ----------------
      - name: Get Latest BrowserStack Build ID
        id: fetch-build
        if: always()
        run: |
          BUILD_ID=$(curl -u "${BROWSERSTACK_USERNAME}:${BROWSERSTACK_ACCESS_KEY}" \
            https://api-cloud.browserstack.com/app-automate/builds.json \
            | jq -r '.[0].automation_build.hashed_id')

          echo "buildid=$BUILD_ID" >> $GITHUB_OUTPUT

      # ---------------- TEST EXECUTION ----------------
      - name: Run iOS Tests on BrowserStack
        continue-on-error: true
        env:
          TEST_CASES: ${{ inputs.test-cases }}
        run: |
          TEST_TAGS="@$TEST_CASES and @IOS"

          echo "Running tests: $TEST_TAGS"

          mvn clean verify -ntp \
            -Dcucumber.filter.tags="$TEST_TAGS" \
            -Dbrowserstack.device.logs.enabled="${{ inputs.device-logs-enabled }}" \
            -Dapp.environment="${{ inputs.environment }}"

      # ---------------- BACKUP RESULTS ----------------
      - name: Backup Serenity JSON Results
        if: always()
        run: |
          mkdir -p target/serenity-backup

          cp target/site/reports/EUDI_Wallet_Version_2026.10.43-Demo/*.json \
            target/serenity-backup/ || true

      # ---------------- RERUN PASS 1 ----------------
      - name: Rerun Pass 1
        if: always()
        run: |
          if [ -s target/rerun.txt ]; then
            mvn test -Dtest=RerunTestRunner -Dapp.environment="${{ inputs.environment }}"
          else
            echo "No rerun.txt found"
          fi

      # ---------------- MERGE RESULTS PASS 1 ----------------
      - name: Merge Results Pass 1
        if: always()
        run: |
          python3 merge_serenity_results.py || true

      # ---------------- RERUN PASS 2 ----------------
      - name: Rerun Pass 2
        if: always()
        run: |
          if [ -s target/rerun2.txt ]; then
            mvn test \
              -Dtest=RerunTestRunner2 \
              -Dcucumber.features="@target/rerun2.txt" \
              -Dapp.environment="${{ inputs.environment }}"
          else
            echo "No rerun2.txt found"
          fi

      # ---------------- MERGE RESULTS PASS 2 ----------------
      - name: Merge Results Pass 2
        if: always()
        run: |
          python3 merge_serenity_results.py || true

      # ---------------- RERUN PASS 3 ----------------
      - name: Rerun Pass 3
        if: always()
        run: |
          if [ -s target/rerun3.txt ]; then
            mvn test \
              -Dtest=RerunTestRunner3 \
              -Dcucumber.features="@target/rerun3.txt" \
              -Dapp.environment="${{ inputs.environment }}"
          else
            echo "No rerun3.txt found"
          fi

      # ---------------- MERGE RESULTS PASS 3 ----------------
      - name: Merge Results Pass 3
        if: always()
        run: |
          python3 merge_serenity_results.py || true

      # ---------------- RERUN PASS 4 ----------------
      - name: Rerun Pass 4
        if: always()
        run: |
          if [ -s target/rerun4.txt ]; then
            mvn test \
              -Dtest=RerunTestRunner4 \
              -Dcucumber.features="@target/rerun4.txt" \
              -Dapp.environment="${{ inputs.environment }}"
          else
            echo "No rerun4.txt found"
          fi

      # ---------------- MERGE RESULTS PASS 4 ----------------
      - name: Merge Results Pass 4
        if: always()
        run: |
          python3 merge_serenity_results.py || true

      # ---------------- REPORT ----------------
      - name: Generate Serenity Report
        if: always()
        run: |
          mvn serenity:aggregate \
            -Dtags="@${{ inputs.test-cases }} and (@ANDROID or @IOS)"

      # ---------------- CUSTOM CSS ----------------
      - name: Replace Serenity Core CSS
        if: always()
        run: |
          REPORT_DIR="target/site/reports/EUDI_Wallet_Version_2026.10.43-Demo"

          cp src/test/resources/custom-style.css \
            "$REPORT_DIR/css/core.css" || true

      # ---------------- ARTIFACTS ----------------
      - name: Upload Serenity Report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ios-serenity-report
          path: target/site/

      - name: Upload Serenity JSON Results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ios-serenity-json
          path: target/site/reports/EUDI_Wallet_Version_2026.10.43-Demo/**/*.json

      # ---------------- BROWSERSTACK LOGS ----------------
      - name: Show downloaded BrowserStack logs
        if: always()
        run: |
          echo "Searching for BrowserStack logs..."

          find src/test/resources/features/ios \
            -type f \
            -path "*/logs/ui/*" || true

      - name: Upload iOS BrowserStack Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-device-logs
          path: src/test/resources/features/ios/**/logs/ui/**
          if-no-files-found: warn