name: Execute Full Pipeline

permissions:
  actions: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      branch-to-checkout:
        description: 'Branch to checkout'
        type: choice
        options:
          - main
          - develop
          - milestone/2026.Q1
        default: develop

      test-cases:
        description: 'Cucumber tags for Android & iOS'
        type: string
        default: "@automated"

      manual-tag:
        description: 'Manual test tag'
        type: string
        default: "@Q3_2025"

jobs:

  # =========================================================
  # 1. TRIGGER ALL WORKFLOWS
  # =========================================================
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Debug Token
        run: |
          echo "Checking token..."

          if [ -z "${{ secrets.GH_PAT }}" ]; then
            echo "TOKEN IS EMPTY"
            exit 1
          fi

          RESPONSE=$(curl -s \
            -H "Authorization: token ${{ secrets.GH_PAT }}" \
            https://api.github.com/user)

          echo "$RESPONSE"

      # ---------------- ANDROID ----------------
      - name: Trigger Android
        run: |
          curl -L -X POST \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/android_execution_with_browserstack.yml/dispatches \
            -d '{
              "ref":"${{ inputs.branch-to-checkout }}",
              "inputs":{
                "branch-to-checkout":"${{ inputs.branch-to-checkout }}",
                "test-cases":"${{ inputs.test-cases }}"
              }
            }'

      # ---------------- IOS ----------------
      - name: Trigger iOS
        run: |
          curl -L -X POST \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/ios_execution_with_browserstack.yml/dispatches \
            -d '{
              "ref":"${{ inputs.branch-to-checkout }}",
              "inputs":{
                "branch-to-checkout":"${{ inputs.branch-to-checkout }}",
                "test-cases":"${{ inputs.test-cases }}"
              }
            }'

      # ---------------- MANUAL ----------------
      - name: Trigger Manual
        run: |
          curl -L -X POST \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/manual.yml/dispatches \
            -d '{
              "ref":"${{ inputs.branch-to-checkout }}",
              "inputs":{
                "branch-to-checkout":"${{ inputs.branch-to-checkout }}",
                "tagName":"${{ inputs.manual-tag }}"
              }
            }'

  # =========================================================
  # 2. WAIT FOR COMPLETION
  # =========================================================
  wait-for-completion:
    runs-on: ubuntu-latest
    needs: trigger

    steps:
      - name: Wait for all workflows to complete
        run: |

          wait_for() {

            WORKFLOW_NAME=$1

            echo "Waiting for: $WORKFLOW_NAME"

            while true; do

              RESPONSE=$(curl -s \
                -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/${{ github.repository }}/actions/runs)

              echo "GitHub API response received"

              # DEBUG
              echo "$RESPONSE" | jq '.' > response.json || true

              # CHECK API ERROR
              MESSAGE=$(echo "$RESPONSE" | jq -r '.message // empty')

              if [[ -n "$MESSAGE" ]]; then
                echo "GitHub API ERROR: $MESSAGE"
                sleep 20
                continue
              fi

              STATUS=$(echo "$RESPONSE" | jq -r \
                --arg NAME "$WORKFLOW_NAME" '
                (.workflow_runs // [])
                | map(select(.name == $NAME))
                | sort_by(.created_at)
                | reverse
                | .[0].status // "not_found"
              ')

              CONCLUSION=$(echo "$RESPONSE" | jq -r \
                --arg NAME "$WORKFLOW_NAME" '
                (.workflow_runs // [])
                | map(select(.name == $NAME))
                | sort_by(.created_at)
                | reverse
                | .[0].conclusion // "unknown"
              ')

              echo "$WORKFLOW_NAME => status=$STATUS conclusion=$CONCLUSION"

              if [[ "$STATUS" == "completed" ]]; then
                break
              fi

              sleep 30
            done
          }

          wait_for "Android Automation Tests Execution"
          wait_for "iOS Automation Tests Execution"
          wait_for "Manual Tests Execution"

          echo "All workflows completed"

  # =========================================================
  # 3. FINAL SUMMARY REPORT
  # =========================================================
  final-summary:
    runs-on: macos-latest
    needs: wait-for-completion

    steps:

      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: oracle

      # ---------------- DOWNLOAD ARTIFACTS ----------------

      - name: Download Android JSON
        uses: actions/download-artifact@v5
        with:
          name: android-serenity-json
          path: reports/android

      - name: Download iOS JSON
        uses: actions/download-artifact@v5
        with:
          name: ios-serenity-json
          path: reports/ios

      - name: Download Manual JSON
        uses: actions/download-artifact@v5
        with:
          name: manual-serenity-json
          path: reports/manual

      # ---------------- MERGE RESULTS ----------------

      - name: Merge JSON Results
        run: |
          mkdir -p target/site/reports/final

          find reports/android -name "*.json" -exec cp {} target/site/reports/final/ \;
          find reports/ios -name "*.json" -exec cp {} target/site/reports/final/ \;
          find reports/manual -name "*.json" -exec cp {} target/site/reports/final/ \;

      # ---------------- FINAL REPORT ----------------

      - name: Generate Final Serenity Report
        run: mvn serenity:aggregate

      - name: Upload Final Report
        uses: actions/upload-artifact@v5
        with:
          name: final-combined-serenity-report
          path: target/site/