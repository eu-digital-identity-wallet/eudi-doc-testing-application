name: Final Summary Report

on:
  workflow_dispatch:
    inputs:
      branch-to-checkout:
        description: 'Branch to checkout'
        type: choice
        options:
          - main
          - develop
          - milestone/2026.Q1
          - milestone/2026.Q2
          - refactor
        default: develop

      test-cases-android:
        description: 'Automated Android test tag'
        type: string
        default: "@automated"

      test-cases-ios:
        description: 'Automated iOS test tag'
        type: string
        default: "@automated"

      manual-tag:
        description: 'Manual test tag'
        type: string
        default: "@Q3_2025"

permissions:
  actions: write
  contents: read

jobs:

  android-tests:
    runs-on: macos-latest
    timeout-minutes: 240

    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          clean: false
          lfs: false
          ref: ${{ inputs.branch-to-checkout }}

      # ---------------- JDK ----------------
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'oracle'

      # ---------------- NODE ----------------
      - name: Set up Node JS
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # ---------------- CLEAN ----------------
      - name: Clean Old Results
        run: |
          rm -rf target/serenity
          rm -rf target/site/reports
          rm -rf target/site/serenity

      - name: Initialize Session Map
        run: echo "" > session_map.txt

      # ---------------- JQ ----------------
      - name: Check jq Installation
        run: |
          if ! command -v jq &> /dev/null; then
            brew install jq
          else
            jq --version
          fi

      # ---------------- BROWSERSTACK CHECK ----------------
      - name: Check BrowserStack Credentials
        run: |
          curl -u "${BROWSERSTACK_USERNAME}:${BROWSERSTACK_ACCESS_KEY}" \
          https://api.browserstack.com/automate/plan.json

      # ---------------- BUILD ID ----------------
      - name: Get Latest BrowserStack Build ID
        id: fetch-build
        run: |
          BUILD_ID=$(curl -u "${BROWSERSTACK_USERNAME}:${BROWSERSTACK_ACCESS_KEY}" \
            https://api-cloud.browserstack.com/app-automate/builds.json \
            | jq -r '.[0].automation_build.hashed_id')
          
          echo "buildid=$BUILD_ID" >> $GITHUB_OUTPUT

      # ---------------- TEST EXECUTION (FIXED) ----------------
      - name: Run Android Tests on BrowserStack
        continue-on-error: true
        env:
          TEST_CASES: ${{ inputs.test-cases-android }}
        run: |
          TEST_TAGS="$TEST_CASES and @ANDROID"
          echo "Running tests: $TEST_TAGS"
          
          mvn clean verify -ntp \
            -Dcucumber.filter.tags="$TEST_TAGS"

      # ---------------- RERUN PASS 1 ----------------
      - name: Rerun Pass 1
        if: always()
        run: |
          if [ -s target/rerun.txt ]; then
            mvn test -Dtest=RerunTestRunner
          else
            echo "No rerun.txt found"
          fi

      - name: Merge Results Pass 1
        if: always()
        run: python3 merge_serenity_results.py || true

      # ---------------- RERUN PASS 2 ----------------
      - name: Rerun Pass 2
        if: always()
        run: |
          if [ -s target/rerun2.txt ]; then
            mvn test -Dtest=RerunTestRunner -Dcucumber.features="@target/rerun2.txt"
          else
            echo "No rerun2.txt found"
          fi

      - name: Final Merge Results
        if: always()
        run: python3 merge_serenity_results.py || true

      # ---------------- REPORT (FIXED) ----------------
      - name: Generate Serenity Report
        if: always()
        run: |
          mvn serenity:aggregate -ntp

      # ---------------- ARTIFACTS ----------------
      - name: Upload Serenity Report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: android-serenity-report
          path: target/site/

      - name: Upload Serenity JSON Results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: android-serenity-json
          path: target/site/reports/**/**/*.json

      - name: Show downloaded BrowserStack logs
        if: always()
        run: |
          echo "Searching for BrowserStack logs..."
          find src/test/resources/features/android -type f -path "*/logs/ui/*" || true

      - name: Upload Android BrowserStack Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-logs
          path: src/test/resources/features/android/**/logs/ui/**
          if-no-files-found: warn

  ios-tests:
    runs-on: macos-latest
    timeout-minutes: 240

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          clean: false
          lfs: false
          ref: ${{ inputs.branch-to-checkout }}

      # ---------------- JAVA + NODE ----------------
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'oracle'

      - name: Set up Node JS
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      # ---------------- CLEAN ----------------
      - name: Clean Old Results
        run: |
          rm -rf target/serenity
          rm -rf target/site/reports
          rm -rf target/site/serenity
          rm -f target/rerun.txt target/rerun2.txt

      - name: Initialize Session Map
        run: echo "" > session_map.txt

      # ---------------- JQ ----------------
      - name: Check jq Installation
        run: |
          if ! command -v jq &> /dev/null; then
            echo "jq not found, installing..."
            brew install jq
          else
            jq --version
          fi

      # ---------------- BROWSERSTACK CHECK ----------------
      - name: Check BrowserStack Credentials
        run: |
          curl -u "${BROWSERSTACK_USERNAME}:${BROWSERSTACK_ACCESS_KEY}" \
          https://api.browserstack.com/automate/plan.json

      # ---------------- BUILD ID ----------------
      - name: Get Latest BrowserStack Build ID
        id: fetch-build
        if: always()
        run: |
          BUILD_ID=$(curl -u "${BROWSERSTACK_USERNAME}:${BROWSERSTACK_ACCESS_KEY}" \
            https://api-cloud.browserstack.com/app-automate/builds.json \
            | jq -r '.[0].automation_build.hashed_id')
          
          echo "buildid=$BUILD_ID" >> $GITHUB_OUTPUT

      # ---------------- TEST EXECUTION ----------------
      - name: Run iOS Tests on BrowserStack
        continue-on-error: true
        run: |
          TEST_TAGS="${{ inputs.test-cases-ios }} and @IOS"
          echo "Running tests: $TEST_TAGS"
          
          mvn test -ntp \
            -Dapp.url=$BROWSERSTACK_APP_URL \
            -Dcucumber.filter.tags="$TEST_TAGS"

      # ---------------- BACKUP RESULTS ----------------
      - name: Backup Serenity JSON Results
        if: always()
        run: |
          mkdir -p target/serenity-backup
          cp target/site/reports/EUDI_Wallet_Version_2026.05.37-Demo/*.json target/serenity-backup/ || true

      # ---------------- RERUN PASS 1 ----------------
      - name: Rerun Pass 1
        if: always()
        run: |
          if [ -s target/rerun.txt ]; then
            echo "Running rerun pass 1..."
            mvn test -Dtest=RerunTestRunner
          else
            echo "No rerun.txt found"
          fi

      - name: Merge Results Pass 1
        if: always()
        run: |
          python3 merge_serenity_results.py || true

      # ---------------- RERUN PASS 2 ----------------
      - name: Rerun Pass 2
        if: always()
        run: |
          if [ -s target/rerun2.txt ]; then
            echo "Running rerun pass 2..."
            mvn test -Dtest=RerunTestRunner -Dcucumber.features="@target/rerun2.txt"
          else
            echo "No rerun2.txt found"
          fi

      - name: Final Merge Results
        if: always()
        run: |
          python3 merge_serenity_results.py || true

      # ---------------- REPORT ----------------
      - name: Generate Serenity Report
        if: always()
        run: |
          mvn serenity:aggregate -Dtags="${{ inputs.test-cases-ios }} and @IOS"

      - name: Replace Serenity Core CSS
        if: always()
        run: |
          REPORT_DIR="target/site/reports/EUDI_Wallet_Version_2026.05.37-Demo"
          cp src/test/resources/custom-style.css "$REPORT_DIR/css/core.css" || true

      # ---------------- ARTIFACTS ----------------
      - name: Upload Serenity Report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ios-serenity-report
          path: target/site/

      - name: Upload Serenity JSON Results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ios-serenity-json
          path: target/site/reports/EUDI_Wallet_Version_2026.05.37-Demo/**/*.json

      - name: Show downloaded BrowserStack logs
        if: always()
        run: |
          echo "Searching for BrowserStack logs..."
          find src/test/resources/features/ios -type f -path "*/logs/ui/*" || true

      - name: Upload iOS BrowserStack Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-device-logs
          path: src/test/resources/features/ios/**/logs/ui/**
          if-no-files-found: warn

  manual-tests:
    runs-on: macos-latest
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v5

      - name: Permission to file .sh
        run: |
          #!/bin/bash
          sudo chmod +x local-execution.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'oracle'

      - name: Set up Node JS 18.16.1
        uses: actions/setup-node@v5
        with:
          node-version: '18.16.1'

      - name: Clean old reports
        run: |
          mvn clean
          rm -rf target/site

      - name: Clean Maven cache
        run: mvn dependency:purge-local-repository -DreResolve=false

      - name: Run Ui Tests
        run: |
          #!/bin/bash
          mvn clean verify -Dcucumber.filter.tags="${{ github.event.inputs.manual-tag }}" "$@"
          rm -rf target/site/serenity 
          mvn serenity:aggregate -Dtags="${{ github.event.inputs.manual-tag }}"
          echo "Modifying JSON files to mark tests as manual..."
          find target/site/reports/EUDI_Wallet_Version_2026.05.37-Demo -name "*.json" | grep -v "nivo-slider\|bootstrap-icons" | while read file; do  
            if grep -q "\"manual\":" "$file" 2>/dev/null; then    
              sed -i '' 's/"manual":\s*false/"manual": true/g' "$file" 2>/dev/null || sed -i 's/"manual":\s*false/"manual": true/g' "$file"    
              sed -i '' 's/"source":\s*"CUCUMBER"/"source": "MANUAL"/g' "$file" 2>/dev/null || sed -i 's/"source":\s*"CUCUMBER"/"source": "MANUAL"/g' "$file"  
            fi
          done

      - name: Produce report
        run: mvn serenity:aggregate -Dtags="${{ github.event.inputs.manual-tag }}"

      - name: Inject Custom CSS into Serenity Report
        if: always()
        run: |
          cp src/test/resources/custom-style.css target/site/reports/EUDI_Wallet_Version_2026.05.37-Demo/css/core.css

      - name: Upload report
        uses: actions/upload-artifact@v5
        with:
          name: manual-serenity-report
          path: target/site

      - name: Upload Serenity JSON Results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: manual-serenity-json    # or ios-serenity-json
          path: target/site/reports/EUDI_Wallet_Version_2026.05.37-Demo/**/*.json

  final-summary:
      runs-on: macos-latest
      needs:
       - android-tests
       - ios-tests
       - manual-tests

      if: always()

      steps:

        - uses: actions/checkout@v5

        - uses: actions/setup-java@v5
          with:
            java-version: 17
            distribution: oracle

        - uses: actions/download-artifact@v5
          with:
            name: android-serenity-json
            path: reports/android

        - uses: actions/download-artifact@v5
          with:
            name: ios-serenity-json
            path: reports/ios

        - uses: actions/download-artifact@v5
          with:
            name: manual-serenity-json
            path: reports/manual

        - run: |
            mkdir -p target/site/reports/EUDI_Wallet_Version_2026.05.37-Demo

            find reports/android -name "*.json" -exec cp {} target/site/reports/EUDI_Wallet_Version_2026.05.37-Demo/ \;
            find reports/ios -name "*.json" -exec cp {} target/site/reports/EUDI_Wallet_Version_2026.05.37-Demo/ \;
            find reports/manual -name "*.json" -exec cp {} target/site/reports/EUDI_Wallet_Version_2026.05.37-Demo/ \;

        - run: mvn serenity:aggregate

        - uses: actions/upload-artifact@v5
          with:
            name: final-combined-serenity-report
            path: target/site
