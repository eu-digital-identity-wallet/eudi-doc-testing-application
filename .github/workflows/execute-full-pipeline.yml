name: Execute Full Pipeline

on:
  workflow_dispatch:
    inputs:
      branch-to-checkout:
        description: 'Branch to checkout'
        type: choice
        options:
          - main
          - develop
          - milestone/2026.Q1
        default: develop

      test-cases:
        description: 'Cucumber tags for Android & iOS'
        type: string
        default: "@automated"

      manual-tag:
        description: 'Manual test tag'
        type: string
        default: "@Q3_2025"

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Android
        run: |
          curl -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          https://api.github.com/repos/${{ github.repository }}/actions/workflows/android-tests.yml/dispatches \
          -d '{
            "ref":"develop",
            "inputs":{
              "branch-to-checkout":"${{ inputs.branch-to-checkout }}",
              "test-cases":"${{ inputs.test-cases }}",
              "platform":"ANDROID"
            }
          }'

      - name: Trigger iOS
        run: |
          curl -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          https://api.github.com/repos/${{ github.repository }}/actions/workflows/ios-tests.yml/dispatches \
          -d '{
            "ref":"develop",
            "inputs":{
              "branch-to-checkout":"${{ inputs.branch-to-checkout }}",
              "test-cases":"${{ inputs.test-cases }}",
              "platform":"IOS"
            }
          }'

      - name: Trigger Manual
        run: |
          curl -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          https://api.github.com/repos/${{ github.repository }}/actions/workflows/manual-tests.yml/dispatches \
          -d '{
            "ref":"develop",
            "inputs":{
              "branch-to-checkout":"${{ inputs.branch-to-checkout }}",
              "tagName":"${{ inputs.manual-tag }}"
            }
          }'