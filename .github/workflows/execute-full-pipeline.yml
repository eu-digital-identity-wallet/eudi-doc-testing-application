name: Execute Full Pipeline

on:
  workflow_dispatch:
    inputs:
      branch-to-checkout:
        required: true
        default: develop

      automated-test-cases:
        required: true
        default: "@automated"

      manual-tag:
        required: true
        default: "@Q3_2025"

jobs:
  trigger-workflows:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Android Workflow
        run: |
          curl -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          https://api.github.com/repos/${{ github.repository }}/actions/workflows/android-tests.yml/dispatches \
          -d '{
            "ref":"${{ github.ref_name }}",
            "inputs":{
              "branch-to-checkout":"${{ inputs.branch-to-checkout }}",
              "test-cases":"${{ inputs.automated-test-cases }}"
            }
          }'

      - name: Trigger iOS Workflow
        run: |
          curl -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          https://api.github.com/repos/${{ github.repository }}/actions/workflows/ios-tests.yml/dispatches \
          -d '{
            "ref":"${{ github.ref_name }}",
            "inputs":{
              "branch-to-checkout":"${{ inputs.branch-to-checkout }}",
              "test-cases":"${{ inputs.automated-test-cases }}"
            }
          }'

      - name: Trigger Manual Workflow
        run: |
          curl -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          https://api.github.com/repos/${{ github.repository }}/actions/workflows/manual-tests.yml/dispatches \
          -d '{
            "ref":"${{ github.ref_name }}",
            "inputs":{
              "branch-to-checkout":"${{ inputs.branch-to-checkout }}",
              "tagName":"${{ inputs.manual-tag }}"
            }
          }'