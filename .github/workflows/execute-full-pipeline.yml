name: Execute Full Pipeline

permissions:
  actions: write
  contents: read

on:
  workflow_dispatch:
    inputs:

      branch-to-checkout:
        description: 'Branch to checkout'
        type: choice
        options:
          - main
          - develop
          - milestone/2026.Q1
        default: develop

      test-cases:
        description: 'Cucumber tags for Android & iOS'
        type: string
        default: "@automated"

      manual-tag:
        description: 'Manual test tag'
        type: string
        default: "@Q3_2025"

jobs:

  # =========================================================
  # 1. TRIGGER WORKFLOWS + CAPTURE RUN IDS
  # =========================================================
  trigger:
    runs-on: ubuntu-latest

    outputs:
      android_run_id: ${{ steps.android.outputs.run_id }}
      ios_run_id: ${{ steps.ios.outputs.run_id }}
      manual_run_id: ${{ steps.manual.outputs.run_id }}

    steps:

      - name: Validate Token
        run: |

          if [ -z "${{ secrets.GH_PAT }}" ]; then
            echo "GH_PAT is empty"
            exit 1
          fi

      # =====================================================
      # ANDROID
      # =====================================================

      - name: Trigger Android Workflow
        id: android
        run: |

          WORKFLOW_FILE="android_execution_with_browserstack.yml"

          echo "Triggering Android workflow..."

          BEFORE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          curl -s -L -X POST \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/${WORKFLOW_FILE}/dispatches \
            -d '{
              "ref":"${{ inputs.branch-to-checkout }}",
              "inputs":{
                "branch-to-checkout":"${{ inputs.branch-to-checkout }}",
                "test-cases":"${{ inputs.test-cases }}"
              }
            }'

          echo "Waiting workflow registration..."
          sleep 15

          RESPONSE=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/${WORKFLOW_FILE}/runs?per_page=5")

          RUN_ID=$(echo "$RESPONSE" | jq -r \
            --arg BEFORE "$BEFORE" '
              .workflow_runs
              | map(select(.created_at >= $BEFORE))
              | sort_by(.created_at)
              | reverse
              | .[0].id
            ')

          echo "Android Run ID: $RUN_ID"

          if [[ -z "$RUN_ID" || "$RUN_ID" == "null" ]]; then
            echo "Failed to detect Android workflow run"
            exit 1
          fi

          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT

      # =====================================================
      # IOS
      # =====================================================

      - name: Trigger iOS Workflow
        id: ios
        run: |

          WORKFLOW_FILE="ios_execution_with_browserstack.yml"

          echo "Triggering iOS workflow..."

          BEFORE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          curl -s -L -X POST \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/${WORKFLOW_FILE}/dispatches \
            -d '{
              "ref":"${{ inputs.branch-to-checkout }}",
              "inputs":{
                "branch-to-checkout":"${{ inputs.branch-to-checkout }}",
                "test-cases":"${{ inputs.test-cases }}"
              }
            }'

          echo "Waiting workflow registration..."
          sleep 15

          RESPONSE=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/${WORKFLOW_FILE}/runs?per_page=5")

          RUN_ID=$(echo "$RESPONSE" | jq -r \
            --arg BEFORE "$BEFORE" '
              .workflow_runs
              | map(select(.created_at >= $BEFORE))
              | sort_by(.created_at)
              | reverse
              | .[0].id
            ')

          echo "iOS Run ID: $RUN_ID"

          if [[ -z "$RUN_ID" || "$RUN_ID" == "null" ]]; then
            echo "Failed to detect iOS workflow run"
            exit 1
          fi

          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT

      # =====================================================
      # MANUAL
      # =====================================================

      - name: Trigger Manual Workflow
        id: manual
        run: |

          WORKFLOW_FILE="manual.yml"

          echo "Triggering Manual workflow..."

          BEFORE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          curl -s -L -X POST \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/${WORKFLOW_FILE}/dispatches \
            -d '{
              "ref":"${{ inputs.branch-to-checkout }}",
              "inputs":{
                "branch-to-checkout":"${{ inputs.branch-to-checkout }}",
                "tagName":"${{ inputs.manual-tag }}"
              }
            }'

          echo "Waiting workflow registration..."
          sleep 15

          RESPONSE=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/${WORKFLOW_FILE}/runs?per_page=5")

          RUN_ID=$(echo "$RESPONSE" | jq -r \
            --arg BEFORE "$BEFORE" '
              .workflow_runs
              | map(select(.created_at >= $BEFORE))
              | sort_by(.created_at)
              | reverse
              | .[0].id
            ')

          echo "Manual Run ID: $RUN_ID"

          if [[ -z "$RUN_ID" || "$RUN_ID" == "null" ]]; then
            echo "Failed to detect Manual workflow run"
            exit 1
          fi

          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT

  # =========================================================
  # 2. WAIT FOR COMPLETION
  # =========================================================
  wait-for-completion:
    runs-on: ubuntu-latest
    needs: trigger

    steps:

      - name: Wait For Android
        run: |
          wait_run() {

            RUN_ID=$1
            NAME=$2

            echo "Waiting for $NAME ($RUN_ID)"

            while true; do

              RESPONSE=$(curl -s \
                -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN_ID)

              if ! echo "$RESPONSE" | jq empty; then
                echo "Invalid JSON received"
                sleep 20
                continue
              fi

              STATUS=$(echo "$RESPONSE" | jq -r '.status')
              CONCLUSION=$(echo "$RESPONSE" | jq -r '.conclusion')

              echo "$NAME => status=$STATUS conclusion=$CONCLUSION"

              if [[ "$STATUS" == "completed" ]]; then

                if [[ "$CONCLUSION" != "success" ]]; then
                  echo "$NAME failed"
                  exit 1
                fi

                break
              fi

              sleep 30
            done
          }

          wait_run "${{ needs.trigger.outputs.android_run_id }}" "Android"
          wait_run "${{ needs.trigger.outputs.ios_run_id }}" "iOS"
          wait_run "${{ needs.trigger.outputs.manual_run_id }}" "Manual"

  # =========================================================
  # 3. FINAL REPORT
  # =========================================================
  final-summary:
    runs-on: macos-latest
    needs: wait-for-completion

    steps:

      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: oracle

      # =====================================================
      # DOWNLOAD ARTIFACTS
      # =====================================================

      - name: Download Android JSON
        uses: actions/download-artifact@v5
        with:
          name: android-serenity-json
          path: reports/android

      - name: Download iOS JSON
        uses: actions/download-artifact@v5
        with:
          name: ios-serenity-json
          path: reports/ios

      - name: Download Manual JSON
        uses: actions/download-artifact@v5
        with:
          name: manual-serenity-json
          path: reports/manual

      # =====================================================
      # MERGE REPORTS
      # =====================================================

      - name: Merge JSON Results
        run: |

          mkdir -p target/site/reports/final

          find reports/android -name "*.json" -exec cp {} target/site/reports/final/ \;
          find reports/ios -name "*.json" -exec cp {} target/site/reports/final/ \;
          find reports/manual -name "*.json" -exec cp {} target/site/reports/final/ \;

      # =====================================================
      # GENERATE FINAL REPORT
      # =====================================================

      - name: Generate Final Serenity Report
        run: mvn serenity:aggregate

      - name: Upload Final Report
        uses: actions/upload-artifact@v5
        with:
          name: final-combined-serenity-report
          path: target/site