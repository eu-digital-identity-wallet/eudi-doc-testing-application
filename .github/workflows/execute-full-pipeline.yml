name: Execute Full Pipeline

on:
  workflow_dispatch:
    inputs:
      branch-to-checkout:
        description: 'Branch to checkout'
        type: choice
        options:
          - main
          - develop
          - milestone/2026.Q1
        default: develop

      test-cases:
        description: 'Cucumber tags for Android & iOS'
        type: string
        default: "@automated"

      manual-tag:
        description: 'Manual test tag'
        type: string
        default: "@Q3_2025"


jobs:

  # =========================================================
  # 1. TRIGGER ALL WORKFLOWS
  # =========================================================
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Android
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/android-tests.yml/dispatches \
            -d '{
              "ref":"develop",
              "inputs":{
                "branch-to-checkout":"${{ inputs.branch-to-checkout }}",
                "test-cases":"${{ inputs.test-cases }}"
              }
            }'

      - name: Trigger iOS
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/ios-tests.yml/dispatches \
            -d '{
              "ref":"develop",
              "inputs":{
                "branch-to-checkout":"${{ inputs.branch-to-checkout }}",
                "test-cases":"${{ inputs.test-cases }}"
              }
            }'

      - name: Trigger Manual
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/manual-tests.yml/dispatches \
            -d '{
              "ref":"develop",
              "inputs":{
                "branch-to-checkout":"${{ inputs.branch-to-checkout }}",
                "tagName":"${{ inputs.manual-tag }}"
              }
            }'
  

  # =========================================================
  # 2. WAIT FOR COMPLETION (IMPORTANT FIX)
  # =========================================================
  wait-for-completion:
    runs-on: ubuntu-latest
    needs: trigger

    steps:
      - name: Wait for all workflows to complete
        run: |
          echo "Waiting for Android, iOS, Manual..."

          wait_for() {
            NAME=$1

            while true; do
              DATA=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                https://api.github.com/repos/${{ github.repository }}/actions/runs)

              STATUS=$(echo "$DATA" | jq -r --arg NAME "$NAME" \
                '.workflow_runs[] | select(.name==$NAME) | .status' | head -1)

              echo "$NAME => status=$STATUS"

              if [[ "$STATUS" == "completed" ]]; then
                break
              fi

              sleep 20
            done
          }

          wait_for "Android Automation Tests Execution"
          wait_for "iOS Automation Tests Execution"
          wait_for "Manual Tests Execution"

          echo "All workflows completed"
  

  # =========================================================
  # 3. FINAL SUMMARY REPORT (INSIDE SAME PIPELINE)
  # =========================================================
  final-summary:
    runs-on: macos-latest
    needs: wait-for-completion

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: oracle

      # ---------------- DOWNLOAD ARTIFACTS ----------------

      - name: Download Android JSON
        uses: actions/download-artifact@v5
        with:
          name: android-serenity-json
          path: reports/android

      - name: Download iOS JSON
        uses: actions/download-artifact@v5
        with:
          name: ios-serenity-json
          path: reports/ios

      - name: Download Manual JSON
        uses: actions/download-artifact@v5
        with:
          name: manual-serenity-json
          path: reports/manual

      # ---------------- MERGE ----------------

      - name: Merge JSON Results
        run: |
          mkdir -p target/site/reports/final

          find reports/android -name "*.json" -exec cp {} target/site/reports/final/ \;
          find reports/ios -name "*.json" -exec cp {} target/site/reports/final/ \;
          find reports/manual -name "*.json" -exec cp {} target/site/reports/final/ \;

      # ---------------- REPORT ----------------

      - name: Generate Final Serenity Report
        run: mvn serenity:aggregate

      - name: Upload Final Report
        uses: actions/upload-artifact@v5
        with:
          name: final-combined-serenity-report
          path: target/site/