name: Android Automation Tests Execution

on:
  workflow_dispatch:
    inputs:
      branch-to-checkout:
        description: 'Branch to checkout'
        type: choice
        options:
          - main
          - develop
          - milestone/2025.Q4
          - milestone/2026.Q1
        default: develop

      test-cases:
        description: 'Choose Test Cases'
        type: string
        default: "@automated"

      platform:
        description: 'Platform to test'
        type: choice
        options:
          - ANDROID
        default: ANDROID


jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 240

    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}

    steps:

      # ----------------------------
      # Checkout
      # ----------------------------
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch-to-checkout }}

      # ----------------------------
      # Setup
      # ----------------------------
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: oracle

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ----------------------------
      # Upload App
      # ----------------------------
      - name: Upload App to BrowserStack
        id: upload_app
        run: |
          response=$(curl -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
            -X POST "https://api-cloud.browserstack.com/app-automate/upload" \
            -F "file=@app.apk")

          echo "app_url=$(echo $response | jq -r '.app_url')" >> $GITHUB_OUTPUT

      # =====================================================
      # 1. INITIAL EXECUTION
      # =====================================================
      - name: Run Full Test Suite (Execution 1)
        id: run1
        continue-on-error: true
        env:
          APP_URL: ${{ steps.upload_app.outputs.app_url }}
        run: |
          mvn test -ntp \
            -Dapp.url=$APP_URL \
            -Dcucumber.filter.tags="${{ inputs.test-cases }} and @ANDROID" \
            -Dserenity.outputDirectory=target/site/serenity-run1

      # =====================================================
      # 2. DETECT FAILURES
      # =====================================================
      - name: Detect Failures
        id: detect
        if: always()
        run: |
          if grep -r '"result":"FAILURE"' target/site/serenity-run1 2>/dev/null; then
            echo "has_failures=true" >> $GITHUB_OUTPUT
          else
            echo "has_failures=false" >> $GITHUB_OUTPUT
          fi

      # =====================================================
      # 3. RERUN FAILED TESTS
      # =====================================================
      - name: Rerun Failed Tests (Execution 2)
        if: steps.detect.outputs.has_failures == 'true'
        continue-on-error: true
        env:
          APP_URL: ${{ steps.upload_app.outputs.app_url }}
        run: |
          mvn test -ntp \
            -Dapp.url=$APP_URL \
            -Dcucumber.options="@target/rerun.txt" \
            -Dserenity.outputDirectory=target/site/serenity-run2

      # =====================================================
      # 4. MERGE RESULTS
      # =====================================================
      - name: Merge Execution Results
        if: always()
        run: |
          mkdir -p target/site/serenity

          cp -r target/site/serenity-run1/* target/site/serenity/ || true
          cp -r target/site/serenity-run2/* target/site/serenity/ || true

      # =====================================================
      # 5. FINAL REPORT
      # =====================================================
      - name: Generate Final Serenity Report
        if: always()
        run: mvn serenity:aggregate

      # =====================================================
      # 6. ARTIFACTS
      # =====================================================
      - name: Upload Serenity Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serenity-report
          path: target/site/reports/

      - name: Upload JSON Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serenity-json
          path: target/site/serenity/**/*.json