name: Android Automation Tests Execution

run-name: "Android Automation Tests Execution | ${{ inputs.test-cases }}"

on:
  workflow_dispatch:
    inputs:
      branch-to-checkout:
        description: 'Branch to checkout'
        type: choice
        options:
          - main
          - develop
          - milestone/2026.Q1
          - milestone/2026.Q2
          - milestone/2026.Q3
          - milestone/2026.Q3.1
        default: develop

      test-cases:
        description: 'Android Tags to execute'
        type: choice
        options:
          - PID_mso_mdoc
          - MDL
          - PID_sdjwt

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 240

    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          clean: false
          lfs: false
          ref: ${{ inputs.branch-to-checkout }}

      # ---------------- JDK ----------------
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'oracle'

      # ---------------- NODE ----------------
      - name: Set up Node JS
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # ---------------- CHROME DIAGNOSTICS ----------------
      - name: Check Chrome version
        run: |
          echo "=== Chrome version ==="
          /Applications/Google\ Chrome.app/Contents/MacOS/Google\ Chrome --version || true

      - name: Check ChromeDriver version
        run: |
          echo "=== ChromeDriver version ==="
          which chromedriver || true
          chromedriver --version || true

      - name: Check Selenium Manager cache
        run: |
          echo "=== Selenium Manager cache ==="
          find ~/.cache/selenium -type f 2>/dev/null || true

      - name: Configure ChromeDriver
        run: |
          CHROMEDRIVER_PATH=$(which chromedriver)
          echo "ChromeDriver path: $CHROMEDRIVER_PATH"
          echo "ChromeDriver version:"
          "$CHROMEDRIVER_PATH" --version
          echo "CHROMEDRIVER_PATH=$CHROMEDRIVER_PATH" >> $GITHUB_ENV

      # ---------------- CLEAN ----------------
      - name: Clean Old Results
        run: |
          rm -rf target/serenity
          rm -rf target/site/reports
          rm -rf target/site/serenity
          rm -f target/rerun.txt target/rerun2.txt target/rerun3.txt

      - name: Initialize Session Map
        run: echo "" > session_map.txt

      # ---------------- JQ ----------------
      - name: Check jq Installation
        run: |
          if ! command -v jq &> /dev/null; then
            brew install jq
          else
            jq --version
          fi

      # ---------------- BROWSERSTACK CHECK ----------------
      - name: Check BrowserStack Credentials
        run: |
          curl -u "${BROWSERSTACK_USERNAME}:${BROWSERSTACK_ACCESS_KEY}" \
          https://api.browserstack.com/automate/plan.json

      # ---------------- BUILD ID ----------------
      - name: Get Latest BrowserStack Build ID
        id: fetch-build
        run: |
          BUILD_ID=$(curl -u "${BROWSERSTACK_USERNAME}:${BROWSERSTACK_ACCESS_KEY}" \
            https://api-cloud.browserstack.com/app-automate/builds.json \
            | jq -r '.[0].automation_build.hashed_id')

          echo "buildid=$BUILD_ID" >> $GITHUB_OUTPUT

      # ---------------- TEST EXECUTION ----------------
      - name: Run Android Tests on BrowserStack
        continue-on-error: true
        env:
          TEST_CASES: ${{ inputs.test-cases }}
        run: |
          TEST_TAGS="@$TEST_CASES and @ANDROID"
          echo "Running tests: $TEST_TAGS"

          mvn clean verify -ntp \
            -Dcucumber.filter.tags="$TEST_TAGS"

      # ---------------- BACKUP RESULTS ----------------
      - name: Backup Serenity JSON Results
        if: always()
        run: |
          mkdir -p target/serenity-backup
          cp target/site/reports/EUDI_Wallet_Version_2026.07.39-Demo/*.json target/serenity-backup/ || true

      # ---------------- RERUN PASS 1 ----------------
      - name: Rerun Pass 1
        if: always()
        run: |
          if [ -s target/rerun.txt ]; then
            mvn test -Dtest=RerunTestRunner
          else
            echo "No rerun.txt found"
          fi

      - name: Merge Results Pass 1
        if: always()
        run: python3 merge_serenity_results.py || true

      # ---------------- RERUN PASS 2 ----------------
      - name: Rerun Pass 2
        if: always()
        run: |
          if [ -s target/rerun2.txt ]; then
            mvn test -Dtest=RerunTestRunner2 -Dcucumber.features="@target/rerun2.txt"
          else
            echo "No rerun2.txt found"
          fi

      - name: Merge Results Pass 2
        if: always()
        run: python3 merge_serenity_results.py || true

      # ---------------- RERUN PASS 3 ----------------
      - name: Rerun Pass 3
        if: always()
        run: |
          if [ -s target/rerun3.txt ]; then
            mvn test -Dtest=RerunTestRunner3 -Dcucumber.features="@target/rerun3.txt"
          else
            echo "No rerun3.txt found"
          fi

      - name: Merge Results Pass 3
        if: always()
        run: python3 merge_serenity_results.py || true

      # ---------------- REPORT ----------------
      - name: Generate Serenity Report
        if: always()
        run: |
          mvn serenity:aggregate -Dtags="@${{ inputs.test-cases }} and (@ANDROID or @IOS)"

      - name: Replace Serenity Core CSS
        if: always()
        run: |
          REPORT_DIR="target/site/reports/EUDI_Wallet_Version_2026.07.39-Demo"
          cp src/test/resources/custom-style.css "$REPORT_DIR/css/core.css" || true

      # ---------------- ARTIFACTS ----------------
      - name: Upload Serenity Report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: android-serenity-report
          path: target/site/

      - name: Upload Serenity JSON Results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: android-serenity-json
          path: target/site/reports/**/**/*.json

      # ---------------- BROWSERSTACK LOGS ----------------
      - name: Show downloaded BrowserStack logs
        if: always()
        run: |
          echo "Searching for BrowserStack logs..."
          find src/test/resources/features/android -type f -path "*/logs/ui/*" || true

      - name: Upload Android BrowserStack Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-logs
          path: src/test/resources/features/android/**/logs/ui/**
          if-no-files-found: warn