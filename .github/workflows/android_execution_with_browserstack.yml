name: Serenity Cucumber Tests

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      RESULTS_DIR: target/site/reports/EUDI_Wallet_Version_2025.12.34-Demo
      BACKUP_DIR: target/serenity-backup

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}

      - name: Clean previous artifacts
        run: |
          rm -f target/rerun.txt target/rerun2.txt || true
          rm -rf "$BACKUP_DIR" || true
          rm -rf "$RESULTS_DIR" || true

      - name: Run main tests
        run: |
          mvn clean test -Dtest=TestRunner -Dcucumber.filter.tags="@ANDROID and @execution"

      - name: Backup Serenity JSON results
        run: |
          mkdir -p "$BACKUP_DIR"
          cp "$RESULTS_DIR"/*.json "$BACKUP_DIR/" || true
          echo "Backed up files:"
          ls -l "$BACKUP_DIR" || true

      - name: Rerun pass 1 (if needed)
        run: |
          if [ -s target/rerun.txt ]; then
            echo "Running rerun pass 1..."
            mvn test -Dtest=RerunTestRunner
          else
            echo "No rerun.txt found"
          fi

      - name: Merge results after pass 1
        run: |
          python3 merge_serenity_results.py || true

      - name: Rerun pass 2 (if needed)
        run: |
          if [ -s target/rerun2.txt ]; then
            echo "Running rerun pass 2..."
            mvn test -Dtest=RerunTestRunner -Dcucumber.features="@target/rerun2.txt"
          else
            echo "No rerun2.txt found"
          fi

      - name: Final merge
        run: |
          python3 merge_serenity_results.py || true

      - name: Serenity aggregate report
        run: |
          rm -rf target/site/serenity
          mvn serenity:aggregate -Dtags="ANDROID and execution"

      - name: Apply custom CSS
        run: |
          REPORT_DIR="$RESULTS_DIR/css"
          CUSTOM_CSS="src/test/resources/custom-style.css"

          CORE_CSS_PATH=$(find "$REPORT_DIR" -name "core.css" | head -n 1)

          if [ -f "$CUSTOM_CSS" ] && [ -n "$CORE_CSS_PATH" ]; then
            cp "$CUSTOM_CSS" "$CORE_CSS_PATH"
            echo "Custom CSS applied"
          else
            echo "Skipping CSS replacement"
          fi

      - name: Upload Serenity Report
        uses: actions/upload-artifact@v4
        with:
          name: serenity-report
          path: target/site/