name: Android Automation Tests Execution

on:
  workflow_dispatch:
    inputs:
      branch-to-checkout:
        description: 'Branch to checkout'
        type: choice
        options:
          - main
          - develop
          - milestone/2025.Q4
          - milestone/2026.Q1
        default: develop

      test-cases:
        description: 'Choose Test Cases'
        type: string
        default: "@automated"

      platform:
        description: 'Platform to test - android'
        type: choice
        options:
          - ANDROID
        default: ANDROID

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 240

    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          ref: ${{ inputs.branch-to-checkout }}

      - name: Download Latest APK
        env:
          REPO: eu-digital-identity-wallet/eudi-app-android-wallet-ui
        run: |
          GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}"

          latest_release=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$REPO/releases/latest")

          apk_url=$(echo "$latest_release" | jq -r '.assets[] | select(.name | contains("Demo.apk")) | .browser_download_url')

          curl -L -o app.apk "$apk_url"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: oracle

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Upload app to BrowserStack
        id: upload_app
        run: |
          response=$(curl -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
            -X POST "https://api-cloud.browserstack.com/app-automate/upload" \
            -F "file=@app.apk")

          app_url=$(echo $response | jq -r '.app_url')
          echo "app_url=$app_url" >> $GITHUB_OUTPUT

      #############################################
      # MAIN TEST EXECUTION (FULL PARITY)
      #############################################

      - name: Run Android Tests (with reruns + report)
        if: ${{ inputs.platform == 'ANDROID' }}
        continue-on-error: true
        env:
          APP_URL: ${{ steps.upload_app.outputs.app_url }}
        run: |

          export CUCUMBER_FILTER_TAGS="${{ inputs.test-cases }} and @ANDROID"

          RESULTS_DIR="target/site/reports/EUDI_Wallet_Version_2025.12.34-Demo"
          BACKUP_DIR="target/serenity-backup"

          rm -f target/rerun.txt target/rerun2.txt
          rm -rf target/site/serenity

          rm -rf android-logs
          mkdir -p android-logs

          mkdir -p "$BACKUP_DIR"

          rm -f "$BACKUP_DIR"/*.json || true
          rm -f "$RESULTS_DIR"/*.json || true

          echo "--- MAIN RUN ---"

          mvn test \
            -ntp \
            -Dtest=TestRunner \
            -Dapp.url="$APP_URL" \
            -Dcucumber.filter.tags="$CUCUMBER_FILTER_TAGS"

          echo "--- BACKUP JSON ---"

          cp "$RESULTS_DIR"/*.json "$BACKUP_DIR/" 2>/dev/null || true

          ########################################
          # RERUN 1
          ########################################

          if [ -s target/rerun.txt ]; then

            mvn test \
              -ntp \
              -Dtest=RerunTestRunner \
              -Dapp.url="$APP_URL"

            python3 merge_serenity_results.py

            cp "$RESULTS_DIR"/*.json "$BACKUP_DIR/" 2>/dev/null || true
          fi

          ########################################
          # RERUN 2
          ########################################

          if [ -s target/rerun2.txt ]; then

            mvn test \
              -ntp \
              -Dtest=RerunTestRunner \
              -Dapp.url="$APP_URL" \
              -Dcucumber.features="@target/rerun2.txt"

            python3 merge_serenity_results.py
          fi

          ########################################
          # SERENITY REPORT
          ########################################

          mvn serenity:aggregate \
            -Dtags="$CUCUMBER_FILTER_TAGS"

          ########################################
          # CUSTOM CSS
          ########################################

          REPORT_DIR="$RESULTS_DIR/css"
          CUSTOM_CSS="src/test/resources/custom-style.css"

          if [ -f "$CUSTOM_CSS" ]; then
            CORE_CSS=$(find "$REPORT_DIR" -name "core.css" | head -n 1)

            if [ -n "$CORE_CSS" ]; then
              cp "$CUSTOM_CSS" "$CORE_CSS"
            fi
          fi

      #############################################
      # DEVICE LOGS (MISSING PIECE FIXED)
      #############################################

      - name: Download BrowserStack Device Logs
        if: always()
        run: |
          BUILD_ID=$(curl -u "${BROWSERSTACK_USERNAME}:${BROWSERSTACK_ACCESS_KEY}" \
            -X GET "https://api-cloud.browserstack.com/app-automate/builds.json" \
            | jq -r '.[0].automation_build.hashed_id')

          mkdir -p android-logs

          while IFS='=' read FEATURE SESSION_ID; do
            [[ "$FEATURE" != *"_Android" ]] && continue

            FEATURE_CLEAN=$(echo "$FEATURE" | tr -d '[:space:]')

            curl -u "${BROWSERSTACK_USERNAME}:${BROWSERSTACK_ACCESS_KEY}" \
              -X GET "https://api-cloud.browserstack.com/app-automate/builds/$BUILD_ID/sessions/$SESSION_ID/devicelogs" \
              -o "android-logs/${FEATURE_CLEAN}.txt"

          done < session_map.txt

      - name: Upload Android Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-logs
          path: android-logs/

      - name: Upload Serenity Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-serenity-report
          path: target/site/reports/*

      - name: Upload JSON Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-serenity-json
          path: target/site/reports/EUDI_Wallet_Version_2025.12.34-Demo/*.json