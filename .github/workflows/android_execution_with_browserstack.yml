name: Android Automation Tests Execution

on:
  workflow_dispatch:
    inputs:
      branch-to-checkout:
        description: 'Branch to checkout'
        type: choice
        options:
          - main
          - develop
          - milestone/2025.Q4
          - milestone/2026.Q1
        default: develop

      test-cases:
        description: 'Choose Test Cases'
        type: string
        default: "@automated"

      platform:
        description: 'Platform to test - android'
        type: choice
        options:
          - ANDROID
        default: ANDROID


jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 240

    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}

    steps:

      # -------------------------
      # Checkout
      # -------------------------
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch-to-checkout }}

      # -------------------------
      # APK Download
      # -------------------------
      - name: Download Latest Release APK
        env:
          REPO: eu-digital-identity-wallet/eudi-app-android-wallet-ui
        run: |
          latest_release=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/$REPO/releases/latest")

          apk_url=$(echo "$latest_release" | jq -r '.assets[] | select(.name | contains("Demo.apk")) | .browser_download_url')

          curl -L -o app.apk "$apk_url"

      # -------------------------
      # Setup
      # -------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: oracle

      - name: Set up Node JS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clean Old Results
        run: |
          rm -rf target/site/serenity*

      # -------------------------
      # Upload App
      # -------------------------
      - name: Upload app to BrowserStack
        id: upload_app
        run: |
          response=$(curl -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
            -X POST "https://api-cloud.browserstack.com/app-automate/upload" \
            -F "file=@app.apk")

          app_url=$(echo $response | jq -r '.app_url')
          echo "app_url=$app_url" >> $GITHUB_OUTPUT

      # =====================================================
      # 1. INITIAL TEST RUN
      # =====================================================
      - name: Run Android Tests (Initial Run)
        id: run1
        continue-on-error: true
        env:
          BROWSERSTACK_APP_URL: ${{ steps.upload_app.outputs.app_url }}
        run: |
          TAGS="${{ inputs.test-cases }} and @ANDROID"

          mvn test -ntp \
            -Dapp.url=$BROWSERSTACK_APP_URL \
            -Dcucumber.filter.tags="$TAGS" \
            -Dserenity.outputDirectory=target/site/serenity-run1

      # =====================================================
      # 2. DETECT FAILURES
      # =====================================================
      - name: Detect Failures
        id: detect_failures
        if: always()
        run: |
          if grep -r '"result":"FAILURE"' target/site/serenity-run1 2>/dev/null; then
            echo "has_failures=true" >> $GITHUB_OUTPUT
          else
            echo "has_failures=false" >> $GITHUB_OUTPUT
          fi

      # =====================================================
      # 3. RERUN FAILED TESTS
      # =====================================================
      - name: Rerun Failed Tests
        if: steps.detect_failures.outputs.has_failures == 'true'
        continue-on-error: true
        env:
          BROWSERSTACK_APP_URL: ${{ steps.upload_app.outputs.app_url }}
        run: |
          mvn test -ntp \
            -Dapp.url=$BROWSERSTACK_APP_URL \
            -Dcucumber.options="@target/rerun/rerun.txt" \
            -Dserenity.outputDirectory=target/site/serenity-run2

      # =====================================================
      # 4. MERGE RESULTS
      # =====================================================
      - name: Merge Serenity Results
        if: always()
        run: |
          mkdir -p target/site/serenity

          cp -r target/site/serenity-run1/* target/site/serenity/ || true
          cp -r target/site/serenity-run2/* target/site/serenity/ || true

      # -------------------------
      # FINAL REPORT
      # -------------------------
      - name: Generate Serenity Report
        if: always()
        run: mvn serenity:aggregate

      # -------------------------
      # CSS override (your logic kept)
      # -------------------------
      - name: Replace Serenity Core CSS
        if: always()
        run: |
          REPORT_DIR="target/site/reports/EUDI_Wallet_Version_2025.12.34-Demo"
          cp src/test/resources/custom-style.css "$REPORT_DIR/css/core.css"

      # -------------------------
      # Upload Reports
      # -------------------------
      - name: Upload Serenity Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-serenity-report
          path: target/site/reports/*

      # -------------------------
      # Logs (unchanged)
      # -------------------------
      - name: Upload Android Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-logs
          path: android-logs/

      - name: Upload Serenity JSON Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-serenity-json
          path: target/site/reports/**/serenity*.json